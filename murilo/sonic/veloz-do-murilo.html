<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #palco { display: block; width: min(100vw, calc(100vh * 1.77778)); height: min(100vh, calc(100vw * 0.5625)); background: #000; cursor: default; touch-action: none; overflow: hidden; }

  .voltar {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 50;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(160deg, #4A90E2 0%, #2E5FCB 100%);
    border: 5px solid #FFF6E6;
    box-shadow: 0 7px 0 rgba(27,20,32,.45), 0 14px 24px rgba(0,0,0,.38);
    text-decoration: none;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .voltar svg { width: 36px; height: 36px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .voltar:hover, .voltar:focus-visible { transform: scale(1.08) rotate(-3deg); box-shadow: 0 9px 0 rgba(27,20,32,.45), 0 18px 30px rgba(0,0,0,.42); }
  .voltar:active { transform: scale(.95); box-shadow: 0 4px 0 rgba(27,20,32,.45), 0 8px 14px rgba(0,0,0,.35); }
  .voltar:focus-visible { outline: none; box-shadow: 0 0 0 5px #FFE066, 0 7px 0 rgba(27,20,32,.45); }
  @media (max-width: 560px) { .voltar { width: 56px; height: 56px; border-width: 4px; } .voltar svg { width: 31px; height: 31px; } }
  @media (prefers-reduced-motion: reduce) { .voltar { transition: none; } }
</style>

      } else if (jogo.ocioso >= 8000 && !jogo.demo) {
        jogo.demo = true;
        iniciarDisparo();
      }
    } else if (e === S.GIRAR) {
      if (jogo.tEstado >= T.girar) entrar(S.DISPARO);
    } else if (e === S.DISPARO) {
      if (jogo.tEstado >= T.disparo) entrar(S.CHEGADA);
    } else if (e === S.CHEGADA) {
      if (jogo.tEstado >= T.chegada) entrar(S.ABERTURA);
    } else if (e === S.ABERTURA) {
      if (jogo.tEstado >= T.abertura) entrar(S.GRATIDAO);
    } else if (e === S.GRATIDAO) {
      if (jogo.tEstado >= T.gratidao) {
        jogo.amigoFase = 'saindo';
        jogo.amigoSaiuEm = jogo.t;
        jogo.saindoDe = { x: jogo.obstCentro.x, y: jogo.obstCentro.y };
        jogo.saindoLado = jogo.lado;
        concluir();
      }
    } else if (e === S.FESTA) {
      if (jogo.tEstado >= 2750 && !jogo.transicao) {
        jogo.transicao = true;
        flash(0.55, 500);
      }
      atualizarFesta(dt);
      if (jogo.tEstado >= T.festa) terminarFesta();
    }
    desenhar();
  }

  function desenharLinhas(p, olhar) {
    if (SEM_BORRAO || e_ !== S.DISPARO) {
      def(el.svg.querySelector('#linhas'), 'opacity', 0);
      for (const r of el.rastro) def(r, 'opacity', 0);
      def(el.cenario, 'transform', '');
      return;
    }
    // linhas de velocidade, contrárias ao disparo
    def(el.svg.querySelector('#linhas'), 'opacity', (0.9 * Math.sin(Math.PI * p)).toFixed(3));
    for (let i = 0; i < el.linhas.length; i++) {
      const y = 300 + i * 90 + (i % 2) * 40;
      const x = olhar > 0
        ? lerp(jogo.origem.x - 200, jogo.destino.x - 400 * (1 - p), p) + i * 40
        : lerp(jogo.origem.x + 200, jogo.destino.x + 400 * (1 - p), p) - i * 40;
      const len = 170 + 110 * Math.sin(Math.PI * p);
      const x1 = olhar > 0 ? x - len : x + len;
      def(el.linhas[i], 'transform', `translate(${x1.toFixed(1)} ${y.toFixed(1)})`);
      def(el.linhas[i], 'opacity', (0.95 * Math.sin(Math.PI * p)).toFixed(3));
    }
    // rastro azul atrás do herói
    const hx = jogo.rastroX || jogo.origem.x;
    for (let i = 0; i < el.rastro.length; i++) {
      const back = (i + 1) * 36 * olhar;
      def(el.rastro[i], 'transform', `translate(${(hx - back).toFixed(1)} ${(jogo.destino.y - 20).toFixed(1)})`);
      def(el.rastro[i], 'opacity', (0.35 * (1 - i / 3) * Math.sin(Math.PI * p)).toFixed(3));
    }
    // cenário estica
    const s = 1 + 0.09 * Math.sin(Math.PI * p);
    def(el.cenario, 'transform', `translate(960 540) scale(${s.toFixed(4)} 1) translate(-960 -540)`);
  }

  let e_ = null;
  function desenhar() {
    const e = jogo.estado;
    e_ = e;
    desenharEstrelas();
    desenharPoeira();
    desenharEggman();

    let reacaoP = -1;
    if (jogo.reacaoAtiva) {
      reacaoP = clamp01((jogo.t - jogo.reacaoEm) / jogo.reacaoDur);
      if (reacaoP >= 1) { reacaoP = -1; jogo.reacaoAtiva = false; }
    }

    const espera = posHeroi();
    let hx = espera.x, hy = espera.y, hr = 0, sx = 1, sy = 1;
    const obstX = (jogo.obstAtivo || e !== S.ESPERANDO)
      ? (jogo.obstCentro.x || posObstaculo().x)
      : posObstaculo().x;
    const olhar = obstX >= hx ? 1 : -1;

    if (e === S.ESPERANDO) {
      sy = 0.97 + 0.02 * Math.sin(jogo.t * 0.0023);
      sx = 1 / sy;
      hr = 1.2 * Math.sin(jogo.t * 0.0013);
      // tapando o pé
      hy += Math.abs(Math.sin(jogo.t * 0.006)) * 2;
    } else if (e === S.GIRAR) {
      const p = clamp01(jogo.tEstado / T.girar);
      hx = jogo.origem.x;
      hy = jogo.origem.y;
      hr = 720 * easeInOutCubic(p) * olhar; // vira bola
      sy = lerp(1, 0.86, Math.sin(Math.PI * p));
      sx = lerp(1, 1.1, Math.sin(Math.PI * p));
    } else if (e === S.DISPARO) {
      const p = clamp01(jogo.tEstado / T.disparo);
      const t = easeInOutQuart(p);
      hx = lerp(jogo.origem.x, jogo.destino.x, t);
      hy = jogo.origem.y - 8 * Math.abs(Math.sin(jogo.t * 0.035)); // passos ainda mais rápidos
      hr = 14 * olhar;
      sx = 1.12; sy = 0.9;
      jogo.rastroX = hx;
    } else if (e === S.CHEGADA) {
      const p = clamp01(jogo.tEstado / T.chegada);
      hx = jogo.destino.x + 18 * olhar * (1 - easeOutCubic(p));
      hy = jogo.destino.y;
      hr = -12 * olhar * (1 - p); // derrapando
      sx = 1.05; sy = 0.92;
    } else if (e === S.ABERTURA) {
      const p = clamp01(jogo.tEstado / T.abertura);
      hx = jogo.destino.x;
      hy = jogo.destino.y;
      hr = lerp(-6, 4, easeOutCubic(p)) * olhar;
      sy = lerp(0.92, 1, easeOutCubic(p));
      sx = lerp(1.05, 1, easeOutCubic(p));
    } else if (e === S.GRATIDAO) {
      const p = clamp01(jogo.tEstado / T.gratidao);
      hx = jogo.destino.x;
      hy = jogo.destino.y;
      hr = 10 * Math.sin(p * Math.PI * 2) * olhar;
      if (reacaoP >= 0) {
        hy += -30 * Math.sin(Math.PI * reacaoP);
        hr += 8 * Math.sin(reacaoP * Math.PI * 2);
      }
    } else if (e === S.FESTA) {
      const hop = Math.abs(Math.sin(Math.PI * jogo.tEstado / 1000));
      hy = espera.y - 44 * hop;
      hr = 5 * Math.sin(2 * Math.PI * jogo.tEstado / 1000);
      sy = 1 + 0.04 * hop;
    }

    def(el.heroi, 'transform',
      `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${hr.toFixed(2)}) scale(${(sx * olhar).toFixed(3)} ${sy.toFixed(3)})`);

    desenharLinhas(e === S.DISPARO ? clamp01(jogo.tEstado / T.disparo) : 0, olhar);

    const saindo = e === S.ESPERANDO && jogo.amigoFase === 'saindo';
    if (jogo.obstAtivo || e === S.GIRAR || e === S.DISPARO || e === S.CHEGADA || e === S.ABERTURA || e === S.GRATIDAO || saindo) {
      const o = (e === S.DISPARO || e === S.CHEGADA || e === S.ABERTURA || e === S.GRATIDAO)
        ? jogo.obstCentro
        : (saindo ? jogo.saindoDe : posObstaculo());
      const ladoDesenho = saindo ? jogo.saindoLado : jogo.lado;
      const entra = clamp01((jogo.t - jogo.obstEntrou) / 320);
      const escO = 0.7 + 0.3 * entra;
      const opO = clamp01(entra * 1.8);

      let rotA = 0, rotB = 0, txA = 0, tyA = 0, txB = 0, tyB = 0, opMet = 1;
      if (e === S.ABERTURA || e === S.GRATIDAO || e === S.FESTA) {
        const p = e === S.ABERTURA ? clamp01(jogo.tEstado / T.abertura) : 1;
        const ep = easeOutCubic(p);
        txA = -110 * ep; tyA = -70 * ep - 40 * p * p;
        txB = 110 * ep; tyB = -70 * ep - 40 * p * p;
        rotA = -38 * ep; rotB = 38 * ep;
        opMet = 1 - clamp01((p - 0.55) / 0.45);
      }
      if (el.obstArte) {
        def(el.obstArte, 'transform',
          `translate(${o.x.toFixed(2)} ${o.y.toFixed(2)}) scale(${(escO * (ladoDesenho === 0 ? 1 : -1)).toFixed(3)} ${escO.toFixed(3)})`);
        def(el.obstArte, 'opacity', (saindo ? 0 : opO).toFixed(3));
        if (el.metadeA) {
          def(el.metadeA, 'transform', `translate(${txA.toFixed(1)} ${tyA.toFixed(1)}) rotate(${rotA.toFixed(1)})`);
          def(el.metadeA, 'opacity', opMet.toFixed(3));
        }
        if (el.metadeB) {
          def(el.metadeB, 'transform', `translate(${txB.toFixed(1)} ${tyB.toFixed(1)}) rotate(${rotB.toFixed(1)})`);
          def(el.metadeB, 'opacity', opMet.toFixed(3));
        }
      }

      if (el.amigoArte) {
        const olharAmigo = ladoDesenho === 0 ? -1 : 1;
        let ax = o.x + (ladoDesenho === 0 ? -74 : 74);
        let ay = o.y + 18;
        let ar = 10 * olharAmigo;
        let asx = 0.9, asy = 0.9, aop = opO;
        if (jogo.amigoFase === 'preso') {
          ar = (10 + 4 * Math.sin(jogo.t * 0.004)) * olharAmigo;
          asx = 0.88; asy = 0.88;
        } else if (jogo.amigoFase === 'livre') {
          ax = o.x + (ladoDesenho === 0 ? -96 : 96);
          ay = o.y + 4;
          ar = 0; asx = 1; asy = 1;
          if (reacaoP >= 0) {
            const rec = REACOES[jogo.reacaoAmigo];
            if (rec) def(el.amigoArte, 'transform', rec.obj(reacaoP));
          }
        } else if (jogo.amigoFase === 'saindo' || jogo.amigoFase === 'fora') {
          const ps = jogo.amigoSaiuEm >= 0 ? clamp01((jogo.t - jogo.amigoSaiuEm) / 360) : 1;
          const dirFora = ladoDesenho === 0 ? -1 : 1;
          ax = o.x + dirFora * (96 + 420 * easeOutCubic(ps));
          ay = o.y + 4 - 80 * Math.abs(Math.sin(Math.PI * ps));
          aop = 1 - ps;
          asx = 1; asy = 1; ar = 0;
          if (ps >= 1) { jogo.amigoFase = 'fora'; jogo.amigoSaiuEm = -1; }
        }
        if (!(jogo.amigoFase === 'livre' && reacaoP >= 0)) {
          def(el.amigoArte, 'transform',
            `translate(${ax.toFixed(2)} ${ay.toFixed(2)}) rotate(${ar.toFixed(2)}) scale(${(asx * olharAmigo).toFixed(3)} ${asy.toFixed(3)})`);
        }
        def(el.amigoArte, 'opacity', aop.toFixed(3));
      }
    } else {
      if (el.obstArte) def(el.obstArte, 'opacity', 0);
      if (el.amigoArte) def(el.amigoArte, 'opacity', 0);
    }

    if (jogo.flashEm >= 0) {
      const p = clamp01((jogo.t - jogo.flashEm) / jogo.flashDur);
      def(el.flash, 'opacity', (jogo.flashPico * Math.sin(Math.PI * p)).toFixed(3));
      if (p >= 1) jogo.flashEm = -1;
    } else {
      def(el.flash, 'opacity', 0);
    }

    if (jogo.mudoAvisoEm >= 0) {
      const p = clamp01((jogo.t - jogo.mudoAvisoEm) / 1000);
      const op = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
      def(el.mudoIcone, 'opacity', op.toFixed(3));
      if (p >= 1) jogo.mudoAvisoEm = -1;
    } else {
      def(el.mudoIcone, 'opacity', 0);
    }
    def(el.mudoRisco, 'opacity', jogo.mudo ? 1 : 0);
  }

  function paraVirtual(ev) {
    const ctm = el.svg.getScreenCTM();
    if (!ctm) return null;
    const pt = el.svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return null;
    return p;
  }
  function centroAlvo() {
    const o = posObstaculo();
    return { x: o.x, y: o.y - 50 };
  }
  function aoClicar(ev) {
    if (ev.button !== 0) return;
    if (jogo.estado !== S.ESPERANDO || !jogo.obstAtivo) return;
    const p = paraVirtual(ev);
    if (!p) return;
    const a = centroAlvo();
    const noCirculo = Math.hypot(p.x - a.x, p.y - a.y) <= RAIO;
    const noTerco = p.x >= TERCO.x1 && p.x <= TERCO.x2 && p.y >= TERCO.y1 && p.y <= TERCO.y2;
    if (!noCirculo && !noTerco) return;
    iniciarDisparo();
  }

  function cancelarDemo() {
    if (!jogo.demo) return false;
    jogo.demo = false;
    if (jogo.estado !== S.ESPERANDO) {
      jogo.obstAtivo = false;
      jogo.espera = 0;
      jogo.poeiraAtiva = false;
      jogo.egg.ativo = false;
      limparObstaculo();
      entrar(S.ESPERANDO);
    }
    return true;
  }
  function aoEntrada() {
    jogo.ocioso = 0;
    cancelarDemo();
  }
  function alternarMudo() {
    jogo.mudo = !jogo.mudo;
    Som.definirMudo(jogo.mudo);
    jogo.mudoAvisoEm = jogo.t;
  }
  function entrarTelaCheia() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const eld = document.documentElement;
      const req = eld.requestFullscreen || eld.webkitRequestFullscreen;
      if (!req) return;
      const p = req.call(eld);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function alternarTela() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        entrarTelaCheia();
      } else {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  const ehCelular = () => !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  function aoToque(ev) {
    if (ev.pointerType !== 'touch') return;
    entrarTelaCheia();
  }

  montarCenario(0);
  montarPlacar();
  if (ehCelular()) entrarTelaCheia();

  el.svg.addEventListener('pointerdown', (ev) => {
    Som.destravar();
    aoEntrada();
    aoToque(ev);
    aoClicar(ev);
  });
  window.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (k === 'm' || k === 'M') { alternarMudo(); }
    else if (k === 'f' || k === 'F') { alternarTela(); }
  });
  window.addEventListener('resize', atualizarEscalaPlacar);
  window.addEventListener('orientationchange', atualizarEscalaPlacar);

  let ultimo = performance.now();
  function quadro(agora) {
    const dt = Math.min(100, agora - ultimo);
    ultimo = agora;
    passo(dt);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
