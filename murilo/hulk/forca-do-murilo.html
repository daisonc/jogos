  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #palco { display: block; width: min(100vw, calc(100vh * 1.77778)); height: min(100vh, calc(100vw * 0.5625)); background: #000; cursor: default; touch-action: none; overflow: hidden; }

  /* Botão de voltar para a vitrine — elemento HTML fixo, fora do SVG.
     Este jogo vive um nível abaixo (murilo/hulk/), então a vitrine é ../../index.html. */
  .voltar {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 50;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(160deg, #7BC043 0%, #3E8E41 100%);
    border: 5px solid #FFF6E6;
    box-shadow: 0 7px 0 rgba(27,20,32,.45), 0 14px 24px rgba(0,0,0,.38);
    text-decoration: none;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .voltar svg { width: 36px; height: 36px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .voltar:hover, .voltar:focus-visible { transform: scale(1.08) rotate(-3deg); box-shadow: 0 9px 0 rgba(27,20,32,.45), 0 18px 30px rgba(0,0,0,.42); }
  .voltar:active { transform: scale(.95); box-shadow: 0 4px 0 rgba(27,20,32,.45), 0 8px 14px rgba(0,0,0,.35); }
  .voltar:focus-visible { outline: none; box-shadow: 0 0 0 5px #FFE066, 0 7px 0 rgba(27,20,32,.45); }
  @media (max-width: 560px) { .voltar { width: 56px; height: 56px; border-width: 4px; } .voltar svg { width: 31px; height: 31px; } }
  @media (prefers-reduced-motion: reduce) { .voltar { transition: none; } }
</style>

  }

  function tremor() {
    if (SEM_TREMOR) return;
    jogo.tremorAtivo = true;
    jogo.tremorEm = jogo.t;
  }
  function desenharTremor() {
    if (!jogo.tremorAtivo) { def(el.mundo, 'transform', ''); return; }
    const p = clamp01((jogo.t - jogo.tremorEm) / TREMOR_MS);
    if (p >= 1) {
      jogo.tremorAtivo = false;
      def(el.mundo, 'transform', '');
      return;
    }
    // 2–3 px, determinístico (seno), uma vez, decai
    const a = (1 - p) * 2.6;
    const dx = Math.sin(jogo.t * 0.12) * a;
    const dy = Math.cos(jogo.t * 0.15) * a * 0.55;
    def(el.mundo, 'transform', `translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
  }

  // ---------- rachadura (a marca que fica) ----------
  function marcarRachadura(x, y) {
    if (jogo.rachaduras >= 3) return;
    const d = 'M-46 8 Q-18 -6 0 4 Q20 -8 48 6 Q22 12 0 10 Q-20 12 -46 8 Z';
    const path = svgNovo('path', {
      d, fill: 'none', stroke: '#2A1A3A', 'stroke-width': 5,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.55,
    });
    path.setAttribute('transform', `translate(${x.toFixed(1)} ${(y + 52).toFixed(1)})`);
    el.rachaduras.appendChild(path);
    jogo.rachaduras++;
  }

  // ---------- festa ----------
  function flash(pico, dur) {
    jogo.flashEm = jogo.t;
    jogo.flashPico = pico;
    jogo.flashDur = dur;
  }
  function iniciarFesta() {
    jogo.festas++;
    flash(0.13, 700);
    Som.festa();
    const rnd = mulberry32(0x51ED270B ^ (jogo.festas * 7919) ^ (jogo.cenario * 104729));
    for (const c of confete) {
      c.x = rnd() * W;
      c.y = -30 - rnd() * 520;
      c.vx = (rnd() - 0.5) * 140;
      c.vy = 260 + rnd() * 280;
      c.r = rnd() * 360;
      c.vr = (rnd() - 0.5) * 440;
      c.ativo = true;
      def(c.el, 'opacity', 1);
    }
  }
  function atualizarConfete(dt) {
    const s = dt / 1000;
    for (const c of confete) {
      if (!c.ativo) continue;
      c.vy += 260 * s;
      c.x += (c.vx + Math.sin((jogo.t + c.r * 13) * 0.0018) * 34) * s;
      c.y += c.vy * s;
      c.r += c.vr * s;
      if (c.y > 1120) { c.ativo = false; def(c.el, 'opacity', 0); continue; }
      def(c.el, 'transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.r.toFixed(1)})`);
    }
  }
  function terminarFesta() {
    apagarEstrelas();
    for (const c of confete) { c.ativo = false; def(c.el, 'opacity', 0); }
    jogo.socorridos = 0;
    jogo.transicao = false;
    jogo.cenario = (jogo.cenario + 1) % CENARIOS.length;
    jogo.obstAtivo = false;
    jogo.espera = 0;
    jogo.poeiraAtiva = false;
    jogo.amigoFase = 'fora';
    jogo.amigoSaiuEm = -1;
    // lado continua (contínuo, atravessa a festa). O herói aparece na espera do novo
    // cenário, do lado oposto ao próximo obstáculo.
    montarCenario(jogo.cenario);
    entrar(S.ESPERANDO);
  }

  // ---------- transições ----------
  function nascerObstaculo() {
    montarObstaculo();
    jogo.espera = 0;
  }
  function iniciarSalto() {
    const o = posObstaculo();
    jogo.obstCentro = { x: o.x, y: o.y };
    jogo.origem = { x: posHeroi().x, y: posHeroi().y };
    const p = posPouso();
    jogo.destino = { x: p.x, y: p.y };
    Som.sopro();
    entrar(S.AGACHAR);
  }
  function concluir() {
    jogo.demo = false;
    if (jogo.socorridos >= 3) {
      jogo.lado ^= 1; // contínuo: atravessa a festa
      limparObstaculo();
      entrar(S.FESTA);
    } else {
      // Flip ANTES de voltar a ESPERANDO: posHeroi() com o lado novo é o pouso
      // onde o herói já está — nenhum teleporte. O próximo obstáculo nasce do
      // outro lado, 400 ms depois (`nascerObstaculo`).
      jogo.lado ^= 1;
      // Não limpa ainda: o amigo precisa terminar o pulinho de saída.
      jogo.obstAtivo = false;
      jogo.espera = 0;
      entrar(S.ESPERANDO);
    }
  }
  function entrar(novo) {
    jogo.estado = novo;
    jogo.tEstado = 0;
    if (novo === S.ESPERANDO) {
      jogo.ocioso = 0;
    } else if (novo === S.AGACHAR) {
      Som.sopro();
    } else if (novo === S.SALTO) {
      Som.whoosh();
    } else if (novo === S.IMPACTO) {
      const p = posPouso();
      soltarPoeira(p.x, p.y + 70);
      tremor();
      Som.thud();
    } else if (novo === S.ROMPIMENTO) {
      jogo.socorridos++;
      acenderEstrela(jogo.socorridos - 1);
      Som.estalo();
      Som.amigo(jogo.somAmigo);
      registrarSocorro();
      marcarRachadura(jogo.obstCentro.x, jogo.obstCentro.y);
      jogo.amigoFase = 'livre';
    } else if (novo === S.GRATIDAO) {
      // US6: reação começa no início de GRATIDÃO e cabe nela (≤ 600 ms).
      const rec = REACOES[jogo.reacaoAmigo];
      jogo.reacaoEm = jogo.t;
      jogo.reacaoDur = rec ? rec.dur : 0;
      jogo.reacaoAtiva = !!rec;
      Som.gratidao(jogo.tomGrato);
    } else if (novo === S.FESTA) {
      iniciarFesta();
    }
  }

  // ---------- loop ----------
  function passo(dt) {
    jogo.t += dt;
    jogo.tEstado += dt;
    const e = jogo.estado;
    if (e === S.ESPERANDO) {
      jogo.ocioso += dt;
      if (!jogo.obstAtivo) {
        jogo.espera += dt;
        if (jogo.espera >= T.pausaObst) nascerObstaculo();
      } else if (jogo.ocioso >= 8000 && !jogo.demo) {
        jogo.demo = true;
        iniciarSalto();
      }
    } else if (e === S.AGACHAR) {
      if (jogo.tEstado >= T.agachar) entrar(S.SALTO);
    } else if (e === S.SALTO) {
      if (jogo.tEstado >= T.salto) entrar(S.IMPACTO);
    } else if (e === S.IMPACTO) {
      if (jogo.tEstado >= T.impacto) entrar(S.ROMPIMENTO);
    } else if (e === S.ROMPIMENTO) {
      if (jogo.tEstado >= T.rompimento) entrar(S.GRATIDAO);
    } else if (e === S.GRATIDAO) {
      if (jogo.tEstado >= T.gratidao) {
        jogo.amigoFase = 'saindo';
        jogo.amigoSaiuEm = jogo.t;
        // Congela de onde o amigo sai, antes do lado virar (o próximo obstáculo
        // nasce do outro lado; a saída é do obstáculo que acabou de se partir).
        jogo.saindoDe = { x: jogo.obstCentro.x, y: jogo.obstCentro.y };
        jogo.saindoLado = jogo.lado;
        concluir();
      }
    } else if (e === S.FESTA) {
      if (jogo.tEstado >= 2750 && !jogo.transicao) {
        jogo.transicao = true;
        flash(0.55, 500);
      }
      atualizarConfete(dt);
      if (jogo.tEstado >= T.festa) terminarFesta();
    }
    desenhar();
  }

  function desenhar() {
    const e = jogo.estado;
    desenharEstrelas();
    desenharPoeira();
    desenharTremor();

    let reacaoP = -1;
    if (jogo.reacaoAtiva) {
      reacaoP = clamp01((jogo.t - jogo.reacaoEm) / jogo.reacaoDur);
      if (reacaoP >= 1) { reacaoP = -1; jogo.reacaoAtiva = false; }
    }

    const espera = posHeroi();
    let hx = espera.x, hy = espera.y, hr = 0, sx = 1, sy = 1;
    // herói sempre de frente para o obstáculo
    const obst = jogo.obstAtivo || e !== S.ESPERANDO ? (jogo.obstCentro.x || posObstaculo().x) : posObstaculo().x;
    const olhar = obst >= hx ? 1 : -1;

    if (e === S.ESPERANDO) {
      // respirando + agachado leve
      sy = 0.96 + 0.02 * Math.sin(jogo.t * 0.0021);
      sx = 1 / sy;
      hr = 1.4 * Math.sin(jogo.t * 0.0013);
    } else if (e === S.AGACHAR) {
      const p = clamp01(jogo.tEstado / T.agachar);
      sy = lerp(1, 0.82, easeOutCubic(p));
      sx = lerp(1, 1.12, easeOutCubic(p));
      hy = espera.y + 14 * p;
    } else if (e === S.SALTO) {
      const p = clamp01(jogo.tEstado / T.salto);
      const t = easeInOutCubic(p);
      hx = lerp(jogo.origem.x, jogo.destino.x, t);
      // parábola: sobe e desce; pico entre 25% e 35% da tela
      hy = lerp(jogo.origem.y, jogo.destino.y, t) - ALTURA_SALTO * Math.sin(Math.PI * t);
      sx = 1.06;
      sy = 1.1;
      hr = 8 * olhar * Math.sin(Math.PI * p);
    } else if (e === S.IMPACTO) {
      const p = clamp01(jogo.tEstado / T.impacto);
      hx = jogo.destino.x;
      hy = jogo.destino.y + 10 * Math.sin(Math.PI * p);
      sy = lerp(0.78, 0.92, easeOutCubic(p));
      sx = lerp(1.18, 1.04, easeOutCubic(p));
      hr = 6 * olhar * (1 - p);
    } else if (e === S.ROMPIMENTO) {
      const p = clamp01(jogo.tEstado / T.rompimento);
      hx = jogo.destino.x;
      hy = jogo.destino.y;
      sy = lerp(0.92, 1, easeOutCubic(p));
      sx = lerp(1.04, 1, easeOutCubic(p));
      hr = lerp(8, -4, easeOutCubic(p)) * olhar;
    } else if (e === S.GRATIDAO) {
      const p = clamp01(jogo.tEstado / T.gratidao);
      hx = jogo.destino.x;
      hy = jogo.destino.y;
      hr = 10 * Math.sin(p * Math.PI * 2) * olhar; // aceno de cabeça
      if (reacaoP >= 0) {
        hy += -30 * Math.sin(Math.PI * reacaoP);
        hr += 8 * Math.sin(reacaoP * Math.PI * 2);
      }
    } else if (e === S.FESTA) {
      const hop = Math.abs(Math.sin(Math.PI * jogo.tEstado / 1000));
      hy = espera.y - 44 * hop;
      hr = 5 * Math.sin(2 * Math.PI * jogo.tEstado / 1000);
      sy = 1 + 0.04 * hop;
    }

    def(el.heroi, 'transform',
      `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${hr.toFixed(2)}) scale(${(sx * olhar).toFixed(3)} ${sy.toFixed(3)})`);

    // obstáculo + amigo
    const saindo = e === S.ESPERANDO && jogo.amigoFase === 'saindo';
    if (jogo.obstAtivo || e === S.AGACHAR || e === S.SALTO || e === S.IMPACTO || e === S.ROMPIMENTO || e === S.GRATIDAO || saindo) {
      const o = (e === S.SALTO || e === S.IMPACTO || e === S.ROMPIMENTO || e === S.GRATIDAO)
        ? jogo.obstCentro
        : (saindo ? jogo.saindoDe : posObstaculo());
      const ladoDesenho = saindo ? jogo.saindoLado : jogo.lado;
      const entra = clamp01((jogo.t - jogo.obstEntrou) / 320);
      const escO = 0.7 + 0.3 * entra;
      const opO = clamp01(entra * 1.8);

      let rotA = 0, rotB = 0, txA = 0, tyA = 0, txB = 0, tyB = 0, opMet = 1;
      if (e === S.ROMPIMENTO || e === S.GRATIDAO || e === S.FESTA) {
        const p = e === S.ROMPIMENTO ? clamp01(jogo.tEstado / T.rompimento) : 1;
        const ep = easeOutCubic(p);
        txA = -110 * ep; tyA = -70 * ep - 40 * p * p;
        txB = 110 * ep; tyB = -70 * ep - 40 * p * p;
        rotA = -38 * ep; rotB = 38 * ep;
        opMet = 1 - clamp01((p - 0.55) / 0.45);
      }
      if (el.obstArte) {
        def(el.obstArte, 'transform',
          `translate(${o.x.toFixed(2)} ${o.y.toFixed(2)}) scale(${(escO * (ladoDesenho === 0 ? 1 : -1)).toFixed(3)} ${escO.toFixed(3)})`);
        def(el.obstArte, 'opacity', (saindo ? 0 : opO).toFixed(3));
        if (el.metadeA) {
          def(el.metadeA, 'transform', `translate(${txA.toFixed(1)} ${tyA.toFixed(1)}) rotate(${rotA.toFixed(1)})`);
          def(el.metadeA, 'opacity', opMet.toFixed(3));
        }
        if (el.metadeB) {
          def(el.metadeB, 'transform', `translate(${txB.toFixed(1)} ${tyB.toFixed(1)}) rotate(${rotB.toFixed(1)})`);
          def(el.metadeB, 'opacity', opMet.toFixed(3));
        }
      }

      // amigo: preso (mexendo) → livre (reação) → saindo (pulinho para fora)
      if (el.amigoArte) {
        const olharAmigo = ladoDesenho === 0 ? -1 : 1; // olha para o herói
        let ax = o.x + (ladoDesenho === 0 ? -74 : 74);
        let ay = o.y + 18;
        let ar = 10 * olharAmigo;
        let asx = 0.9, asy = 0.9, aop = opO;
        if (jogo.amigoFase === 'preso') {
          ar = (10 + 4 * Math.sin(jogo.t * 0.004)) * olharAmigo;
          asx = 0.88; asy = 0.88;
        } else if (jogo.amigoFase === 'livre') {
          ax = o.x + (ladoDesenho === 0 ? -96 : 96);
          ay = o.y + 4;
          ar = 0;
          asx = 1; asy = 1;
          if (reacaoP >= 0) {
            const rec = REACOES[jogo.reacaoAmigo];
            if (rec) def(el.amigoArte, 'transform', rec.obj(reacaoP));
          }
        } else if (jogo.amigoFase === 'saindo' || jogo.amigoFase === 'fora') {
          const ps = jogo.amigoSaiuEm >= 0 ? clamp01((jogo.t - jogo.amigoSaiuEm) / 360) : 1;
          const dirFora = ladoDesenho === 0 ? -1 : 1; // sai para o lado do herói
          ax = o.x + dirFora * (96 + 420 * easeOutCubic(ps));
          ay = o.y + 4 - 80 * Math.abs(Math.sin(Math.PI * ps));
          aop = 1 - ps;
          asx = 1; asy = 1; ar = 0;
          if (ps >= 1) { jogo.amigoFase = 'fora'; jogo.amigoSaiuEm = -1; }
        }
        if (!(jogo.amigoFase === 'livre' && reacaoP >= 0)) {
          def(el.amigoArte, 'transform',
            `translate(${ax.toFixed(2)} ${ay.toFixed(2)}) rotate(${ar.toFixed(2)}) scale(${(asx * olharAmigo).toFixed(3)} ${asy.toFixed(3)})`);
        }
        def(el.amigoArte, 'opacity', aop.toFixed(3));
      }
    } else {
      if (el.obstArte) def(el.obstArte, 'opacity', 0);
      if (el.amigoArte) def(el.amigoArte, 'opacity', 0);
    }

    if (jogo.flashEm >= 0) {
      const p = clamp01((jogo.t - jogo.flashEm) / jogo.flashDur);
      def(el.flash, 'opacity', (jogo.flashPico * Math.sin(Math.PI * p)).toFixed(3));
      if (p >= 1) jogo.flashEm = -1;
    } else {
      def(el.flash, 'opacity', 0);
    }

    if (jogo.mudoAvisoEm >= 0) {
      const p = clamp01((jogo.t - jogo.mudoAvisoEm) / 1000);
      const op = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
      def(el.mudoIcone, 'opacity', op.toFixed(3));
      if (p >= 1) jogo.mudoAvisoEm = -1;
    } else {
      def(el.mudoIcone, 'opacity', 0);
    }
    def(el.mudoRisco, 'opacity', jogo.mudo ? 1 : 0);
  }

  // ---------- entrada ----------
  function paraVirtual(ev) {
    const ctm = el.svg.getScreenCTM();
    if (!ctm) return null;
    const pt = el.svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return null;
    return p;
  }
  function centroObstaculoAlvo() {
    const o = posObstaculo();
    return { x: o.x, y: o.y - 50 }; // centro visual do obstáculo (um pouco acima da base)
  }
  function aoClicar(ev) {
    if (ev.button !== 0) return;
    if (jogo.estado !== S.ESPERANDO || !jogo.obstAtivo) return;
    const p = paraVirtual(ev);
    if (!p) return;
    const a = centroObstaculoAlvo();
    const noCirculo = Math.hypot(p.x - a.x, p.y - a.y) <= RAIO;
    const noTerco = p.x >= TERCO.x1 && p.x <= TERCO.x2 && p.y >= TERCO.y1 && p.y <= TERCO.y2;
    if (!noCirculo && !noTerco) return;
    iniciarSalto();
  }

  // ---------- attract mode + teclas do adulto ----------
  function cancelarDemo() {
    if (!jogo.demo) return false;
    jogo.demo = false;
    if (jogo.estado !== S.ESPERANDO) {
      jogo.obstAtivo = false;
      jogo.espera = 0;
      jogo.poeiraAtiva = false;
      jogo.tremorAtivo = false;
      limparObstaculo();
      entrar(S.ESPERANDO);
    }
    return true;
  }
  function aoEntrada() {
    jogo.ocioso = 0;
    cancelarDemo();
  }
  function alternarMudo() {
    jogo.mudo = !jogo.mudo;
    Som.definirMudo(jogo.mudo);
    jogo.mudoAvisoEm = jogo.t;
  }
  function alternarTela() {
    try {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      } else {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  let ultimoToque = -1;
  function aoToqueRapido(ev) {
    if (ev.pointerType !== 'touch') return;
    if (jogo.estado !== S.ESPERANDO) { ultimoToque = -1; return; }
    const agora = performance.now();
    if (ultimoToque >= 0 && agora - ultimoToque <= 320) { ultimoToque = -1; alternarTela(); }
    else ultimoToque = agora;
  }

  // ---------- init ----------
  montarCenario(0);
  montarPlacar();

  el.svg.addEventListener('pointerdown', (ev) => {
    Som.destravar();
    aoEntrada();
    aoToqueRapido(ev);
    aoClicar(ev);
  });
  window.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (k === 'm' || k === 'M') { alternarMudo(); }
    else if (k === 'f' || k === 'F') { alternarTela(); }
  });
  window.addEventListener('blur', () => { ultimoToque = -1; });

  let ultimo = performance.now();
  function quadro(agora) {
    const dt = Math.min(100, agora - ultimo); // NF7: clamp de 100 ms
    ultimo = agora;
    passo(dt);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
