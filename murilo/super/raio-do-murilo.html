  .voltar {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 50;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(160deg, #E23B4E 0%, #8B1E2D 100%);
    border: 5px solid #FFF6E6;
    box-shadow: 0 7px 0 rgba(27,20,32,.45), 0 14px 24px rgba(0,0,0,.38);
    text-decoration: none;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .voltar svg { width: 36px; height: 36px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .voltar:hover, .voltar:focus-visible { transform: scale(1.08) rotate(-3deg); box-shadow: 0 9px 0 rgba(27,20,32,.45), 0 18px 30px rgba(0,0,0,.42); }
  .voltar:active { transform: scale(.95); box-shadow: 0 4px 0 rgba(27,20,32,.45), 0 8px 14px rgba(0,0,0,.35); }
  .voltar:focus-visible { outline: none; box-shadow: 0 0 0 5px #FFE066, 0 7px 0 rgba(27,20,32,.45); }
  @media (max-width: 560px) { .voltar { width: 56px; height: 56px; border-width: 4px; } .voltar svg { width: 31px; height: 31px; } }
  @media (prefers-reduced-motion: reduce) { .voltar { transition: none; } }

  function montarBrinquedo() {

    const art = criarArte(cfg.ico);
    if (art) el.brinquedo.replaceChildren(art);
    el.brinqArte = art;
    jogo.briqAtivo = true;
    jogo.briqEntrou = jogo.t;
    jogo.briqId = cfg.id;
    jogo.briqIco = cfg.ico;
    jogo.somBriq = cfg.som;
    jogo.reacaoBriq = cfg.reacao;
    jogo.tomGrato = cfg.tomGrato;
    jogo.reacaoAtiva = false;
  }

  const placarContagem = Object.create(null);
  const placarLinhas = Object.create(null);
  let placarN = 0;

  function escalaPlacar() {
    return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? PLACAR_ESCALA_TOQUE : 1;
  }
  function atualizarEscalaPlacar() {
    const k = escalaPlacar();
    if (k <= 1) { el.placar.removeAttribute('transform'); return; }
    const ax = PLACAR.x + PLACAR.largura, ay = PLACAR.topo;
    el.placar.setAttribute('transform', `translate(${ax} ${ay}) scale(${k}) translate(${-ax} ${-ay})`);
  }
  function montarPlacar() {
    const fundo = svgNovo('rect', {
      x: PLACAR.x, y: PLACAR.topo, width: PLACAR.largura, height: 0, rx: 18,
      fill: '#1B1420', opacity: 0,
    });
    el.placar.appendChild(fundo);
    el.placarFundo = fundo;
    atualizarEscalaPlacar();
  }
  function atualizarFundoPlacar() {
    def(el.placarFundo, 'height', PLACAR.pad * 2 + placarN * PLACAR.passo);
    def(el.placarFundo, 'opacity', placarN > 0 ? 0.4 : 0);
  }
  function adicionarLinhaPlacar(id, tplId) {
    const cy = PLACAR.topo + PLACAR.pad + placarN * PLACAR.passo + PLACAR.passo / 2;
    const holder = svgNovo('g', { transform: `translate(${PLACAR.iconeX} ${cy.toFixed(1)}) scale(${PLACAR.escala})` });
    const arte = criarArte(tplId);
    if (arte) holder.appendChild(arte);
    const txt = svgNovo('text', {
      x: PLACAR.numX, y: (cy + 15).toFixed(1), 'text-anchor': 'start',
      'font-family': '"Arial Black","Segoe UI",system-ui,sans-serif',
      'font-size': 42, 'font-weight': 800,
      fill: '#FFF8E7', stroke: '#1B1420', 'stroke-width': 2.6,
      'paint-order': 'stroke', 'stroke-linejoin': 'round',
    });
    txt.textContent = '1';
    el.placar.appendChild(holder);
    el.placar.appendChild(txt);
    placarLinhas[id] = { txt };
    placarN++;
  }
  function registrarGuarda() {
    const id = jogo.briqId;
    if (!id) return;
    const n = (placarContagem[id] || 0) + 1;
    placarContagem[id] = n;
    if (n === 1) adicionarLinhaPlacar(id, jogo.briqIco);
    else placarLinhas[id].txt.textContent = String(n);
    atualizarFundoPlacar();
  }

  const CORES_CONFETE = ['#FFD166', '#E23B4E', '#4ECDC4', '#FFF4E0', '#2E6BD6'];
  const confete = [];
  for (let i = 0; i < 14; i++) {
    const r = document.createElementNS(NS_SVG, 'rect');
    r.setAttribute('width', 15 + (i % 3) * 6);
    r.setAttribute('height', 24);
    r.setAttribute('rx', 3);
    r.setAttribute('fill', CORES_CONFETE[i % CORES_CONFETE.length]);
    r.setAttribute('opacity', 0);
    el.confete.appendChild(r);
    confete.push({ el: r, x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, ativo: false });
  }

  const jogo = {
    estado: S.ESPERANDO, t: 0, tEstado: 0,
    cenario: 0, guardados: 0, festas: 0,
    somBriq: null, briqId: null, briqIco: null,
    reacaoBriq: null, tomGrato: 0, reacaoAtiva: false, reacaoEm: -1, reacaoDur: 0,
    lado: 0,
    briqAtivo: false, briqEntrou: 0, espera: 0,
    briqCentro: { x: 0, y: 0 },
    heroiDesenhado: { x: 0, y: 0 },
    caixaMundo: { x: 0, y: 0 },
    flashEm: -1, flashPico: 0, flashDur: 700,
    poeiraAtiva: false, poeiraEm: 0, poeiraCentro: { x: 0, y: 0 },
    transicao: false,
    ocioso: 0, demo: false, mudo: false, mudoAvisoEm: -1,
  };
  const estadoEstrelas = [0, 1, 2].map(() => ({ acesa: false, acendeuEm: -1, apagouEm: -1 }));

  const cenarioAtual = () => CENARIOS[jogo.cenario];

  function posHeroi() {
    const c = cenarioAtual();
    return jogo.lado === 0 ? c.esq.heroi : c.dir.heroi;
  }
  function posBrinquedo() {
    const c = cenarioAtual();
    return jogo.lado === 0 ? c.esq.obst : c.dir.obst;
  }

  function acenderEstrela(i) {
    const st = estadoEstrelas[i];
    if (!st) return;
    st.acesa = true;
    st.acendeuEm = jogo.t;
    st.apagouEm = -1;
  }
  function apagarEstrelas() {
    for (const st of estadoEstrelas) {
      if (st.acesa) st.apagouEm = jogo.t;
      st.acesa = false;
    }
  }
  function desenharEstrelas() {
    for (let i = 0; i < 3; i++) {
      const st = estadoEstrelas[i], node = el.estrelas[i], halo = el.halos[i];
      let op = 0.55, haloOp = 0, esc = 1;
      if (st.acesa) {
        const p = clamp01((jogo.t - st.acendeuEm) / T.brilho);
        const ep = easeOutCubic(p);
        op = lerp(0.55, 1, ep);
        haloOp = 0.9 * ep;
        esc = 1 + 0.6 * (1 - ep);
        if (jogo.estado === S.FESTA) {
          const pulso = Math.sin(jogo.t * 0.008 + i * 1.4);
          esc *= 1 + 0.08 * pulso;
          haloOp *= 1 + 0.2 * pulso;
        }
      } else if (st.apagouEm >= 0) {
        const p = clamp01((jogo.t - st.apagouEm) / 300);
        op = lerp(1, 0.55, p);
        haloOp = 0.9 * (1 - p);
        if (p >= 1) st.apagouEm = -1;
      }
      def(node, 'opacity', op.toFixed(3));
      def(node, 'fill', st.acesa || (st.apagouEm >= 0 && jogo.t - st.apagouEm < 300) ? '#FFD166' : '#8C7FA6');
      def(node, 'transform', `translate(${960 + (i - 1) * 72} 1006) scale(${esc.toFixed(3)})`);
      def(halo, 'opacity', Math.max(0, haloOp).toFixed(3));
    }
  }

  function desenharPoeira() {
    if (!jogo.poeiraAtiva) {
      for (const p of el.poeira) def(p, 'opacity', 0);
      return;
    }
    const p = clamp01((jogo.t - jogo.poeiraEm) / 380);
    const cx = jogo.poeiraCentro.x, cy = jogo.poeiraCentro.y;
    for (let i = 0; i < el.poeira.length; i++) {
      const a = (i / el.poeira.length) * Math.PI * 2 + 0.5;
      const dist = 8 + 52 * easeOutCubic(p);
      const x = cx + Math.cos(a) * dist;
      const y = cy + Math.sin(a) * dist * 0.6 - 14 * easeOutCubic(p);
      const s = 0.5 + 0.9 * Math.sin(Math.PI * p);
      def(el.poeira[i], 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${Math.max(0, s).toFixed(3)})`);
      def(el.poeira[i], 'opacity', ((1 - p) * 0.85).toFixed(3));
    }
    if (p >= 1) jogo.poeiraAtiva = false;
  }
  function soltarPoeira(x, y) {
    jogo.poeiraAtiva = true;
    jogo.poeiraEm = jogo.t;
    jogo.poeiraCentro = { x, y };
  }

  function flash(pico, dur) {
    jogo.flashEm = jogo.t;
    jogo.flashPico = pico;
    jogo.flashDur = dur;
  }
  let rndConfete = mulberry32(0x51ED270B);
  function reposicionarConfete(c, noTopo) {
    c.x = rndConfete() * W;
    c.y = noTopo ? -30 - rndConfete() * 420 : -30 - rndConfete() * 620;
    c.vx = (rndConfete() - 0.5) * 120;
    c.vy = 200 + rndConfete() * 200;
    c.r = rndConfete() * 360;
    c.vr = (rndConfete() - 0.5) * 400;
    c.ativo = true;
    def(c.el, 'opacity', 1);
    def(c.el, 'transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.r.toFixed(1)})`);
  }
  function iniciarFesta() {
    jogo.festas++;
    flash(0.12, 700);
    Som.festa();
    rndConfete = mulberry32(0x51ED270B ^ (jogo.festas * 7919) ^ (jogo.cenario * 104729));
    for (const c of confete) reposicionarConfete(c, false);
  }
  function atualizarFesta(dt) {
    const s = dt / 1000;
    const aindaCai = jogo.tEstado < T.festa - 500;
    for (const c of confete) {
      if (!c.ativo) continue;
      c.vy += 110 * s;
      c.x += (c.vx + Math.sin((jogo.t + c.r * 13) * 0.0018) * 40) * s;
      c.y += c.vy * s;
      c.r += c.vr * s;
      if (c.y > 1120) {
        if (aindaCai) reposicionarConfete(c, true);
        else { c.ativo = false; def(c.el, 'opacity', 0); }
        continue;
      }
      def(c.el, 'transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.r.toFixed(1)})`);
    }
  }
  function terminarFesta() {
    apagarEstrelas();
    for (const c of confete) { c.ativo = false; def(c.el, 'opacity', 0); }
    jogo.guardados = 0;
    jogo.transicao = false;
    jogo.lado ^= 1;
    jogo.cenario = (jogo.cenario + 1) % CENARIOS.length;
    jogo.briqAtivo = false;
    jogo.espera = 0;
    montarCenario(jogo.cenario);
    entrar(S.ESPERANDO);
  }

  function nascerBrinquedo() {
    montarBrinquedo();
    jogo.espera = 0;
  }
  function iniciarRaio() {
    const o = posBrinquedo();
    jogo.briqCentro = { x: o.x, y: o.y };
    Som.sopro();
    entrar(S.MIRAR);
  }
  function concluir() {
    jogo.demo = false;
    limparBrinquedo();
    if (jogo.guardados >= 3) {
      entrar(S.FESTA);
    } else {
      jogo.lado ^= 1;
      jogo.briqAtivo = false;
      jogo.espera = 0;
      entrar(S.ESPERANDO);
    }
  }
  function entrar(novo) {
    jogo.estado = novo;
    jogo.tEstado = 0;
    if (novo === S.ESPERANDO) {
      jogo.ocioso = 0;
    } else if (novo === S.MIRAR) {
      Som.sopro();
    } else if (novo === S.LASER) {
      Som.laser();
    } else if (novo === S.COLETA) {
      jogo.guardados++;
      acenderEstrela(jogo.guardados - 1);
      Som.pop();
      Som.brinquedo(jogo.somBriq);
    } else if (novo === S.GUARDA) {
      registrarGuarda();
      const rec = REACOES[jogo.reacaoBriq];
      jogo.reacaoEm = jogo.t;
      jogo.reacaoDur = rec ? rec.dur : 0;
      jogo.reacaoAtiva = !!rec;
      Som.gratidao(jogo.tomGrato);
      soltarPoeira(jogo.caixaMundo.x, jogo.caixaMundo.y);
    } else if (novo === S.FESTA) {
      iniciarFesta();
    }
  }

  function passo(dt) {
    jogo.t += dt;
    jogo.tEstado += dt;
    const e = jogo.estado;
    if (e === S.ESPERANDO) {
      jogo.ocioso += dt;
      if (!jogo.briqAtivo) {
        jogo.espera += dt;
        if (jogo.espera >= T.pausaAlvo) nascerBrinquedo();
      } else if (jogo.ocioso >= 8000 && !jogo.demo) {
        jogo.demo = true;
        iniciarRaio();
      }
    } else if (e === S.MIRAR) {
      if (jogo.tEstado >= T.mirar) entrar(S.LASER);
    } else if (e === S.LASER) {
      if (jogo.tEstado >= T.laser) entrar(S.COLETA);
    } else if (e === S.COLETA) {
      if (jogo.tEstado >= T.coleta) entrar(S.GUARDA);
    } else if (e === S.GUARDA) {
      if (jogo.tEstado >= T.guarda) concluir();
    } else if (e === S.FESTA) {
      if (jogo.tEstado >= 2750 && !jogo.transicao) {
        jogo.transicao = true;
        flash(0.5, 500);
      }
      atualizarFesta(dt);
      if (jogo.tEstado >= T.festa) terminarFesta();
    }
    desenhar();
  }

  function desenhar() {
    const e = jogo.estado;
    desenharEstrelas();
    desenharPoeira();

    let reacaoP = -1;
    if (jogo.reacaoAtiva) {
      reacaoP = clamp01((jogo.t - jogo.reacaoEm) / jogo.reacaoDur);
      if (reacaoP >= 1) { reacaoP = -1; jogo.reacaoAtiva = false; }
    }

    const base = posHeroi();
    const alvoBase = (e !== S.ESPERANDO) ? jogo.briqCentro : posBrinquedo();
    const dir = alvoBase.x >= base.x ? 1 : -1;

    const bob = 9 * Math.sin(jogo.t * 0.0022);
    const capaOnd = 5 * Math.sin(jogo.t * 0.0031);

    let hx = base.x, hy = base.y + bob, hr = 3 * dir, sx = 1, sy = 1;

    if (e === S.MIRAR) {
      const p = clamp01(jogo.tEstado / T.mirar);
      hr = lerp(3 * dir, 9 * dir, easeInOutCubic(p));
    } else if (e === S.LASER) {
      hr = 9 * dir;
      hy -= 6 * Math.sin(Math.PI * clamp01(jogo.tEstado / T.laser));
    } else if (e === S.COLETA) {
      hr = 6 * dir;
    } else if (e === S.GUARDA) {
      hr = 3 * dir;
      if (reacaoP >= 0) {
        hy += -18 * Math.sin(Math.PI * reacaoP);
        hr += 7 * Math.sin(reacaoP * Math.PI * 2);
      }
    } else if (e === S.FESTA) {
      const hop = Math.abs(Math.sin(Math.PI * jogo.tEstado / 900));
      hy -= 40 * hop;
      hr = 9 * Math.sin(2 * Math.PI * jogo.tEstado / 900);
      sx = 1 + 0.03 * hop;
    }

    jogo.heroiDesenhado = { x: hx, y: hy };

    def(el.heroi, 'transform',
      `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${hr.toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
    def(el.capa, 'transform', `rotate(${(capaOnd + 3 * Math.sin(jogo.t * 0.002)).toFixed(2)} -10 -30)`);

    // posição do brinquedo / caixa
    const caixa = {
      x: hx + CAIXA_X * Math.cos(hr * Math.PI / 180) - CAIXA_Y * Math.sin(hr * Math.PI / 180),
      y: hy + CAIXA_X * Math.sin(hr * Math.PI / 180) + CAIXA_Y * Math.cos(hr * Math.PI / 180),
    };
    jogo.caixaMundo = caixa;

    // brinquedo
    const mostrarBrinquedo = jogo.briqAtivo || e === S.MIRAR || e === S.LASER || e === S.COLETA;
    if (mostrarBrinquedo && el.brinqArte) {
      const o = (e === S.LASER || e === S.COLETA) ? jogo.briqCentro : posBrinquedo();
      const entra = clamp01((jogo.t - jogo.briqEntrou) / 320);
      const eEntrada = easeOutCubic(entra);
      const escBase = ESCALA_BRINQUEDO * (0.72 + 0.28 * eEntrada);
      const opBase = clamp01(entra * 1.6);

      let bx = o.x, by = o.y, bop = opBase, bsc = escBase, brot = 0;
      const balanco = 7 * Math.sin(jogo.t * 0.0017 + jogo.briqEntrou * 0.001);
      const flutua = 7 * Math.sin(jogo.t * 0.0023 + 1.1);

      if (e === S.ESPERANDO || e === S.MIRAR) {
        by += flutua * (1 - clamp01((jogo.t - jogo.briqEntrou) / 900));
        brot = balanco;
      } else if (e === S.LASER) {
        const p = clamp01(jogo.tEstado / T.laser);
        const treme = 3 * Math.sin(jogo.t * 0.05) * (0.4 + p);
        bx += treme;
        by += 2 * Math.cos(jogo.t * 0.043) + flutua * 0.4;
        brot = balanco * 0.6;
        bsc = escBase * (1 + 0.06 * Math.sin(Math.PI * p));
      } else if (e === S.COLETA) {
        const p = clamp01(jogo.tEstado / T.coleta);
        const t = easeInOutCubic(p);
        const alvoX = caixa.x, alvoY = caixa.y - 8;
        const cx = (o.x + alvoX) / 2;
        const cy = Math.min(o.y, alvoY) - 105;
        bx = bez(o.x, cx, alvoX, t);
        by = bez(o.y, cy, alvoY, t);
        bsc = lerp(escBase, escBase * 0.42, t);
        bop = 1 - clamp01((p - 0.82) / 0.18);
        brot = 300 * t * dir;
      } else {
        bop = 0;
      }

      def(el.brinqArte, 'transform',
        `translate(${bx.toFixed(2)} ${by.toFixed(2)}) rotate(${brot.toFixed(1)}) scale(${bsc.toFixed(3)})`);
      def(el.brinqArte, 'opacity', bop.toFixed(3));

      // halo
      const haloOp = (e === S.ESPERANDO || e === S.MIRAR)
        ? (0.5 + 0.22 * Math.sin(jogo.t * 0.0028)) * opBase
        : (e === S.LASER ? 0.85 : 0);
      def(el.brinquedoHalo, 'transform', `translate(${o.x.toFixed(1)} ${o.y.toFixed(1)})`);
      def(el.brinquedoHalo, 'opacity', haloOp.toFixed(3));
    } else {
      if (el.brinqArte) def(el.brinqArte, 'opacity', 0);
      def(el.brinquedoHalo, 'opacity', 0);
    }

    // raios
    const raioAtivo = e === S.LASER || (e === S.COLETA && jogo.tEstado < 90);
    if (raioAtivo) {
      const alvo = jogo.briqCentro;
      const exA = hx - OLHO_DX, exB = hx + OLHO_DX, ey = hy + OLHO_DY;
      const aparece = e === S.LASER ? easeOutCubic(clamp01(jogo.tEstado / 70)) : 1 - clamp01(jogo.tEstado / 90);

      // dois feixes que se abrem no meio e se juntam no brinquedo
      const dx = alvo.x - (hx), dy = alvo.y - (ey);
      const comp = Math.max(1, Math.hypot(dx, dy));
      const nx = -dy / comp, ny = dx / comp;
      const abertura = 38;

      const pares = [
        [el.raioA, el.raioGlowA, exA, -abertura],
        [el.raioB, el.raioGlowB, exB, abertura],
      ];
      for (const [fino, grosso, ex, desvio] of pares) {
        const cx = (ex + alvo.x) / 2 + nx * desvio;
        const cy = (ey + alvo.y) / 2 + ny * desvio;
        const d = `M${ex.toFixed(1)} ${ey.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${alvo.x.toFixed(1)} ${alvo.y.toFixed(1)}`;
        def(fino, 'd', d);
        def(grosso, 'd', d);
      }
      def(el.raioG, 'opacity', aparece.toFixed(3));
      const pulso = 0.7 + 0.3 * Math.sin(jogo.t * 0.03);
      def(el.raioImpacto, 'transform', `translate(${alvo.x.toFixed(1)} ${alvo.y.toFixed(1)})`);
      def(el.raioImpacto, 'opacity', (0.55 * aparece * pulso).toFixed(3));
      def(el.raioNucleo, 'transform', `translate(${alvo.x.toFixed(1)} ${alvo.y.toFixed(1)})`);
      def(el.raioNucleo, 'opacity', (0.95 * aparece).toFixed(3));
      def(el.olhoGlowA, 'opacity', aparece.toFixed(3));
      def(el.olhoGlowB, 'opacity', aparece.toFixed(3));
    } else {
      def(el.raioG, 'opacity', 0);
      def(el.raioImpacto, 'opacity', 0);
      def(el.raioNucleo, 'opacity', 0);
      def(el.olhoGlowA, 'opacity', 0);
      def(el.olhoGlowB, 'opacity', 0);
    }

    // caixa: tampa abre na coleta e fecha na guarda
    let abertura = 0, brilho = 0;
    if (e === S.COLETA) {
      abertura = easeOutCubic(clamp01(jogo.tEstado / 180));
      brilho = 0.35 * abertura;
    } else if (e === S.GUARDA) {
      abertura = 1 - easeInOutCubic(clamp01(jogo.tEstado / 170));
      brilho = 0.5 + 0.4 * Math.sin(clamp01(jogo.tEstado / T.guarda) * Math.PI);
    } else if (e === S.FESTA) {
      brilho = 0.55 + 0.45 * Math.sin(jogo.t * 0.009);
    }
    def(el.tampa, 'transform', `rotate(${(-58 * abertura).toFixed(1)} -37 -27)`);
    def(el.caixaHalo, 'opacity', clamp01(brilho).toFixed(3));

    if (jogo.flashEm >= 0) {
      const p = clamp01((jogo.t - jogo.flashEm) / jogo.flashDur);
      def(el.flash, 'opacity', (jogo.flashPico * Math.sin(Math.PI * p)).toFixed(3));
      if (p >= 1) jogo.flashEm = -1;
    } else {
      def(el.flash, 'opacity', 0);
    }

    if (jogo.mudoAvisoEm >= 0) {
      const p = clamp01((jogo.t - jogo.mudoAvisoEm) / 1000);
      const op = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
      def(el.mudoIcone, 'opacity', op.toFixed(3));
      if (p >= 1) jogo.mudoAvisoEm = -1;
    } else {
      def(el.mudoIcone, 'opacity', 0);
    }
    def(el.mudoRisco, 'opacity', jogo.mudo ? 1 : 0);
  }

  function bez(a, b, c, t) {
    return (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
  }

  function paraVirtual(ev) {
    const ctm = el.svg.getScreenCTM();
    if (!ctm) return null;
    const pt = el.svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return null;
    return p;
  }
  function centroAlvo() {
    return posBrinquedo();
  }
  function aoClicar(ev) {
    if (ev.button !== 0) return;
    if (jogo.estado !== S.ESPERANDO || !jogo.briqAtivo) return;
    const p = paraVirtual(ev);
    if (!p) return;
    const a = centroAlvo();
    const noCirculo = Math.hypot(p.x - a.x, p.y - a.y) <= RAIO;
    const noTerco = p.x >= TERCO.x1 && p.x <= TERCO.x2 && p.y >= TERCO.y1 && p.y <= TERCO.y2;
    if (!noCirculo && !noTerco) return;
    iniciarRaio();
  }

  function cancelarDemo() {
    if (!jogo.demo) return false;
    jogo.demo = false;
    if (jogo.estado !== S.ESPERANDO) {
      jogo.briqAtivo = false;
      jogo.espera = 0;
      jogo.poeiraAtiva = false;
      limparBrinquedo();
      entrar(S.ESPERANDO);
    }
    return true;
  }
  function aoEntrada() {
    jogo.ocioso = 0;
    cancelarDemo();
  }
  function alternarMudo() {
    jogo.mudo = !jogo.mudo;
    Som.definirMudo(jogo.mudo);
    jogo.mudoAvisoEm = jogo.t;
  }
  function entrarTelaCheia() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const eld = document.documentElement;
      const req = eld.requestFullscreen || eld.webkitRequestFullscreen;
      if (!req) return;
      const p = req.call(eld);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function alternarTela() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        entrarTelaCheia();
      } else {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  const ehCelular = () => !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  function aoToque(ev) {
    if (ev.pointerType !== 'touch') return;
    entrarTelaCheia();
  }

  montarCenario(0);
  montarPlacar();
  if (ehCelular()) entrarTelaCheia();

  el.svg.addEventListener('pointerdown', (ev) => {
    Som.destravar();
    aoEntrada();
    aoToque(ev);
    aoClicar(ev);
  });
  window.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (k === 'm' || k === 'M') { alternarMudo(); }
    else if (k === 'f' || k === 'F') { alternarTela(); }
  });
  window.addEventListener('resize', atualizarEscalaPlacar);
  window.addEventListener('orientationchange', atualizarEscalaPlacar);

  let ultimo = performance.now();
  function quadro(agora) {
    const dt = Math.min(100, agora - ultimo);
    ultimo = agora;
    passo(dt);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
