<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #palco { display: block; width: min(100vw, calc(100vh * 1.77778)); height: min(100vh, calc(100vw * 0.5625)); background: #000; cursor: default; touch-action: none; overflow: hidden; }

  /* v1.5 — botão de voltar para a vitrine (a criança não usa o voltar do navegador).
     Elemento HTML fixo: não escala com a cena, então continua grande e clicável. */
  .voltar {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 50;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(160deg, #FF7A59 0%, #E23B4E 100%);
    border: 5px solid #FFF6E6;
    box-shadow: 0 7px 0 rgba(27,20,32,.45), 0 14px 24px rgba(0,0,0,.38);
    text-decoration: none;
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .voltar svg { width: 36px; height: 36px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .voltar:hover, .voltar:focus-visible { transform: scale(1.08) rotate(-3deg); box-shadow: 0 9px 0 rgba(27,20,32,.45), 0 18px 30px rgba(0,0,0,.42); }
  .voltar:active { transform: scale(.95); box-shadow: 0 4px 0 rgba(27,20,32,.45), 0 8px 14px rgba(0,0,0,.35); }
  .voltar:focus-visible { outline: none; box-shadow: 0 0 0 5px #FFE066, 0 7px 0 rgba(27,20,32,.45); }
  @media (max-width: 560px) { .voltar { width: 56px; height: 56px; border-width: 4px; } .voltar svg { width: 31px; height: 31px; } }
  @media (prefers-reduced-motion: reduce) { .voltar { transition: none; } }
</style>

    jogo.alvoId = cfg.id;
    jogo.alvoTpl = cfg.tpl;
    jogo.reacaoAlvo = cfg.reacao;
    jogo.tomGrato = cfg.tomGrato;
    jogo.reacaoAtiva = false;
  }
  function montarTravesso() {
    // Com 4 cenários (par), a alternância só por rodada fixaria um travesso por cenário
    // (telhados/rua sempre com o Duende, parque/praia sempre com o Abutre). Somar a volta
    // — floor(rodada / CENARIOS.length) — mantém a variedade, sem sorteio e sem `if`.
    const idx = (jogo.rodada + Math.floor(jogo.rodada / CENARIOS.length)) % TRAVESSOS.length;
    const cfg = TRAVESSOS[idx];
    const novo = clonarTemplate(cfg.tpl);
    if (!novo) return;
    novo.id = 'travesso';
    el.travesso.replaceWith(novo);
    el.travesso = novo;
    el.chapeu = novo.querySelector('.gag-chapeu');
    jogo.somTravesso = cfg.som;
    jogo.gagTravesso = cfg.gag;
  }

  // ---------- placar (feature 1 / v1.4) ----------
  // Uma linha por resgatável já salvo: o desenho do item à esquerda, o número de
  // salvamentos à direita. A linha nasce no primeiro salvamento e não se move depois,
  // então nenhum dígito muda de lugar quando um item novo entra.
  const placarContagem = Object.create(null);
  const placarLinhas = Object.create(null);
  let placarN = 0;

  // v1.4.2 — no celular a cena inteira encolhe pelo letterbox e o placar encolhe junto.
  // Em telas de toque (ponteiro primário grosso) o grupo do placar é ampliado em torno do
  // próprio canto superior direito, para ícones e números ficarem legíveis — sem mudar o
  // desktop e sem arte nova na cena.
  const PLACAR_ESCALA_TOQUE = 1.5;
  function escalaPlacar() {
    return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? PLACAR_ESCALA_TOQUE : 1;
  }
  function atualizarEscalaPlacar() {
    const k = escalaPlacar();
    if (k <= 1) { el.placar.removeAttribute('transform'); return; }
    const ax = PLACAR.x + PLACAR.largura, ay = PLACAR.topo;
    el.placar.setAttribute('transform', `translate(${ax} ${ay}) scale(${k}) translate(${-ax} ${-ay})`);
  }

  function montarPlacar() {
    const fundo = svgNovo('rect', {
      x: PLACAR.x, y: PLACAR.topo, width: PLACAR.largura, height: 0, rx: 18,
      fill: '#1B1420', opacity: 0,
    });
    el.placar.appendChild(fundo);
    el.placarFundo = fundo;
    atualizarEscalaPlacar();
  }
  function atualizarFundoPlacar() {
    def(el.placarFundo, 'height', PLACAR.pad * 2 + placarN * PLACAR.passo);
    def(el.placarFundo, 'opacity', placarN > 0 ? 0.4 : 0);
  }
  function adicionarLinhaPlacar(id, tplId) {
    const cy = PLACAR.topo + PLACAR.pad + placarN * PLACAR.passo + PLACAR.passo / 2;
    const holder = svgNovo('g', { transform: `translate(${PLACAR.iconeX} ${cy.toFixed(1)}) scale(${PLACAR.escala})` });
    const arte = clonarTemplate(tplId);
    if (arte) {
      // O halo dourado existe para o alvo vivo; no placar só atrapalha a leitura, então sai.
      const halo = arte.firstElementChild;
      if (halo && (halo.getAttribute('fill') || '').indexOf('halo-estrela') >= 0) halo.remove();
      holder.appendChild(arte);
    }
    const txt = svgNovo('text', {
      x: PLACAR.numX, y: (cy + 15).toFixed(1), 'text-anchor': 'start',
      'font-family': '"Arial Black","Segoe UI",system-ui,sans-serif',
      'font-size': 42, 'font-weight': 800,
      fill: '#FFF8E7', stroke: '#1B1420', 'stroke-width': 2.6,
      'paint-order': 'stroke', 'stroke-linejoin': 'round',
    });
    txt.textContent = '1';
    el.placar.appendChild(holder);
    el.placar.appendChild(txt);
    placarLinhas[id] = { txt };
    placarN++;
  }
  function registrarResgate() {
    const id = jogo.alvoId;
    if (!id) return;
    const n = (placarContagem[id] || 0) + 1;
    placarContagem[id] = n;
    if (n === 1) adicionarLinhaPlacar(id, jogo.alvoTpl);
    else placarLinhas[id].txt.textContent = String(n);
    atualizarFundoPlacar();
  }

  // ---------- confete (nÃ³s prÃ©-criados; sÃ³ transform/opacity) ----------
  const CORES_CONFETE = ['#FFD166','#F26D5B','#4ECDC4','#FFF4E0','#B39DDB'];
  const confete = [];
  for (let i = 0; i < 20; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', 9 + (i % 3) * 3);
    r.setAttribute('height', 15);
    r.setAttribute('rx', 2);
    r.setAttribute('fill', CORES_CONFETE[i % CORES_CONFETE.length]);
    r.setAttribute('opacity', 0);
    el.confete.appendChild(r);
    confete.push({ el: r, x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, ativo: false });
  }

  // ---------- estado ----------
  const jogo = {
    estado: S.ESPERANDO, t: 0, tEstado: 0,
    cenario: 0, resgates: 0, festas: 0, rodada: 0,
    somAlvo: null, somTravesso: 'ihihi',
    alvoId: null, alvoTpl: null,
    lado: 0,
    alvoAtivo: true, alvoCongelado: false, alvoEntrou: 0,
    espera: 0, duracaoBalanco: BALANCOS[0],
    alvoCentro: { x: 0, y: 0 }, alvoAngulo: 0,
    arco: null, ancora: { x: 0, y: 0 },
    splatAtivo: false, splatEm: 0, splatCentro: null,
    faiscasAtivas: false, faiscasEm: 0, faiscasCentro: { x: 0, y: 0 },
    flashEm: -1, flashPico: 0, flashDur: 700,
    transicao: false,
    ocioso: 0, demo: false, mudo: false, mudoAvisoEm: -1,
    reacaoAlvo: null, tomGrato: 0, reacaoAtiva: false, reacaoEm: -1, reacaoDur: 0,
    gagTravesso: null, gagTocada: false,
    travesso: { ativo: false, inicio: 0, x0: 0, y0: 0, x1: 0, y1: 0, dur: 1800, escala: 1 },
  };
  const estadoEstrelas = [0,1,2].map(() => ({ acesa: false, acendeuEm: -1, apagouEm: -1 }));

  const cenarioAtual = () => CENARIOS[jogo.cenario];

  // v1.4 (feature 2) — inversão de lado. O cenário é espelhado em torno do eixo central
  // (x = W/2), incluindo a rota do travesso: sem espelhar a rota, ele apareceria a menos
  // de 60% da largura do herói e violaria L7/US4. A alternância é por contador (`jogo.lado`),
  // nunca sorteada.
  function espelharLayout(c) {
    return {
      heroi: { x: W - c.heroi.x, y: c.heroi.y },
      ancorAlvo: { x: W - c.ancorAlvo.x, y: c.ancorAlvo.y },
      centroAlvo: { x: -c.centroAlvo.x, y: c.centroAlvo.y },
      cordaAlvo: c.cordaAlvo ? { x: -c.cordaAlvo.x, y: c.cordaAlvo.y } : null,
      rotaTravesso: {
        x0: W - c.rotaTravesso.x0, y0: c.rotaTravesso.y0,
        x1: W - c.rotaTravesso.x1, y1: c.rotaTravesso.y1,
        dur: c.rotaTravesso.dur, escala: c.rotaTravesso.escala,
      },
    };
  }
  const layoutAtual = () => jogo.lado ? espelharLayout(cenarioAtual()) : cenarioAtual();

  function posAlvo() {
    const c = layoutAtual();
    if (jogo.alvoCongelado) return { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, ang: jogo.alvoAngulo };
    const ang = 2.4 * Math.sin(jogo.t * 0.0014 + 1.2);
    const p = girar(c.centroAlvo.x, c.centroAlvo.y, ang);
    return { x: c.ancorAlvo.x + p.x, y: c.ancorAlvo.y + p.y, ang };
  }

  // v1.4.1 — ponto de ancoragem da teia para o balanço. Fica na bissetriz perpendicular de
  // h0 (partida) e h1 (resgatável), na altura TEIA_ANCORA_Y: assim os dois pontos caem
  // sobre a MESMA circunferência de pivô, o herói descreve um pêndulo limpo em ferradura
  // e o resgatável é alcançado exatamente no fim do arco.
  function ancoraTeia(h0, h1) {
    const mx = (h0.x + h1.x) / 2, my = (h0.y + h1.y) / 2;
    const dx = h1.x - h0.x, dy = h1.y - h0.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    if (Math.abs(ny) < 1e-2) return { x: mx, y: TEIA_ANCORA_Y }; // segmento quase vertical
    const s = (TEIA_ANCORA_Y - my) / ny;
    return { x: mx + s * nx, y: my + s * ny };
  }

  // ---------- estrelas ----------
  function acenderEstrela(i) {
    const st = estadoEstrelas[i];
    if (!st) return;
    st.acesa = true;
    st.acendeuEm = jogo.t;
    st.apagouEm = -1;
  }
  function apagarEstrelas() {
    for (const st of estadoEstrelas) {
      if (st.acesa) st.apagouEm = jogo.t;
      st.acesa = false;
    }
  }
  function desenharEstrelas() {
    for (let i = 0; i < 3; i++) {
      const st = estadoEstrelas[i], node = el.estrelas[i], halo = el.halos[i];
      let op = 0.36, haloOp = 0, esc = 1;
      if (st.acesa) {
        const p = clamp01((jogo.t - st.acendeuEm) / T.brilho);
        const ep = easeOutCubic(p);
        op = lerp(0.36, 1, ep);
        haloOp = 0.85 * ep;
        esc = 1 + 0.55 * (1 - ep);
        if (jogo.estado === S.FESTA) {
          const pulso = Math.sin(jogo.t * 0.008 + i * 1.4);
          esc *= 1 + 0.07 * pulso;
          haloOp *= 1 + 0.18 * pulso;
        }
      } else if (st.apagouEm >= 0) {
        const p = clamp01((jogo.t - st.apagouEm) / 300);
        op = lerp(1, 0.36, p);
        haloOp = 0.85 * (1 - p);
        if (p >= 1) st.apagouEm = -1;
      }
      def(node, 'opacity', op.toFixed(3));
      def(node, 'transform', `translate(${960 + (i - 1) * 72} 1038) scale(${esc.toFixed(3)})`);
      def(halo, 'opacity', Math.max(0, haloOp).toFixed(3));
    }
  }

  function desenharSplat() {
    if (!jogo.splatAtivo) { def(el.splat, 'opacity', 0); return; }
    const d = jogo.t - jogo.splatEm;
    if (d < 0) { def(el.splat, 'opacity', 0); return; }
    const p = clamp01(d / 300);
    const sc = jogo.splatCentro || jogo.alvoCentro;
    def(el.splat, 'transform', `translate(${sc.x.toFixed(2)} ${sc.y.toFixed(2)}) scale(${(1 + 0.25 * p).toFixed(3)})`);
    def(el.splat, 'opacity', (0.95 * (1 - p)).toFixed(3));
    if (p >= 1) jogo.splatAtivo = false;
  }

  function desenharFaiscas() {
    if (!jogo.faiscasAtivas) {
      for (const f of el.faiscas) def(f, 'opacity', 0);
      return;
    }
    const p = clamp01((jogo.t - jogo.faiscasEm) / 450);
    for (let i = 0; i < el.faiscas.length; i++) {
      const a = (i / el.faiscas.length) * Math.PI * 2 + 0.5;
      const dist = 12 + 58 * easeOutCubic(p);
      const x = jogo.faiscasCentro.x + Math.cos(a) * dist;
      const y = jogo.faiscasCentro.y + Math.sin(a) * dist;
      const s = 0.45 + 0.75 * Math.sin(Math.PI * p);
      def(el.faiscas[i], 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${Math.max(0, s).toFixed(3)})`);
      def(el.faiscas[i], 'opacity', ((1 - p) * 0.95).toFixed(3));
    }
    if (p >= 1) jogo.faiscasAtivas = false;
  }

  // ---------- Travesso: sempre longe, de costas, fugindo ----------
  function iniciarTravesso() {
    const c = layoutAtual(), d = jogo.travesso, cfg = c.rotaTravesso;
    d.ativo = true; d.inicio = jogo.t;
    d.x0 = cfg.x0; d.y0 = cfg.y0; d.x1 = cfg.x1; d.y1 = cfg.y1;
    d.dur = cfg.dur; d.escala = cfg.escala;
    jogo.gagTocada = false;
    if (el.chapeu) { def(el.chapeu, 'transform', ''); def(el.chapeu, 'opacity', 1); }
    Som.travesso(jogo.somTravesso);
  }
  function desenharTravesso() {
    const d = jogo.travesso;
    if (!d.ativo) { def(el.travesso, 'opacity', 0); return; }
    const p = clamp01((jogo.t - d.inicio) / d.dur);
    const e = easeInOutCubic(p);
    const x = lerp(d.x0, d.x1, e);
    const y = lerp(d.y0, d.y1, e) + Math.sin(p * Math.PI * 2.2) * 5;
    const banco = Math.sin(p * Math.PI * 1.6) * 5 - 2;
    const op = p < 0.08 ? p / 0.08 : p > 0.88 ? (1 - p) / 0.12 : 1;

    // M2 (v1.2): uma trapalhada por fuga, no ponto declarado em TRAVESSOS[i].gag.
    // O gesto é sempre no ar e nunca reduz a distância horizontal ao herói.
    let gagRot = 0;
    const gag = jogo.gagTravesso;
    if (gag) {
      const gd = GAGS[gag.id] || { dur: 0.4 };
      const q = p - gag.quando;
      if (q >= 0 && !jogo.gagTocada) { jogo.gagTocada = true; Som.trapalhada(gag.som); }
      if (gag.id === 'cambalhota') gagRot = 360 * easeInOutCubic(clamp01(q / gd.dur));
      if (el.chapeu && q >= 0) {
        const hp = clamp01(q / gd.dur);
        if (hp < 1) {
          def(el.chapeu, 'transform', `translate(${(30 * hp).toFixed(1)} ${(58 * hp + 60 * hp * hp).toFixed(1)}) rotate(${(320 * hp).toFixed(1)})`);
          def(el.chapeu, 'opacity', (1 - clamp01((hp - 0.5) / 0.5)).toFixed(3));
        }
      }
    }
    def(el.travesso, 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(banco + gagRot).toFixed(2)}) scale(${d.escala})`);
    def(el.travesso, 'opacity', Math.max(0, op).toFixed(3));
    if (p >= 1) d.ativo = false;
  }

  // ---------- festa ----------
  function flash(pico, dur) {
    jogo.flashEm = jogo.t;
    jogo.flashPico = pico;
    jogo.flashDur = dur;
  }
  function iniciarFesta() {
    jogo.festas++;
    flash(0.13, 700);
    Som.festa();
    const rnd = mulberry32(0x51ED270B ^ (jogo.festas * 7919) ^ (jogo.cenario * 104729));
    for (const c of confete) {
      c.x = rnd() * W;
      c.y = -30 - rnd() * 520;
      c.vx = (rnd() - 0.5) * 140;
      c.vy = 260 + rnd() * 280;
      c.r = rnd() * 360;
      c.vr = (rnd() - 0.5) * 440;
      c.ativo = true;
      def(c.el, 'opacity', 1);
    }
  }
  function atualizarConfete(dt) {
    const s = dt / 1000;
    for (const c of confete) {
      if (!c.ativo) continue;
      c.vy += 260 * s;
      c.x += (c.vx + Math.sin((jogo.t + c.r * 13) * 0.0018) * 34) * s;
      c.y += c.vy * s;
      c.r += c.vr * s;
      if (c.y > 1120) { c.ativo = false; def(c.el, 'opacity', 0); continue; }
      def(c.el, 'transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.r.toFixed(1)})`);
    }
  }
  function terminarFesta() {
    apagarEstrelas();
    for (const c of confete) { c.ativo = false; def(c.el, 'opacity', 0); }
    jogo.resgates = 0;
    jogo.transicao = false;
    jogo.rodada++;
    jogo.cenario = (jogo.cenario + 1) % CENARIOS.length;
    jogo.alvoAtivo = false;
    jogo.alvoCongelado = false;
    jogo.espera = 0;
    jogo.splatAtivo = false;
    jogo.travesso.ativo = false;
    montarCenario(jogo.cenario);
    entrar(S.ESPERANDO);
  }

  // ---------- transiÃ§Ãµes ----------
  function nascerAlvo() {
    montarAlvo();
    jogo.alvoAtivo = true;
    jogo.alvoCongelado = false;
    jogo.espera = 0;
    jogo.alvoEntrou = jogo.t;
    jogo.splatAtivo = false;
    def(el.splat, 'opacity', 0);
    iniciarTravesso();
  }
  function iniciarTeia() {
    const a = posAlvo();
    jogo.alvoCentro = { x: a.x, y: a.y };
    jogo.alvoAngulo = a.ang;
    jogo.alvoCongelado = true;
    jogo.duracaoBalanco = BALANCOS[jogo.resgates % 3];
    const home = layoutAtual().heroi;
    const h0 = { x: home.x, y: home.y };
    const h1 = { x: a.x - 28, y: a.y - 26 };
    // v1.4.1: a teia ancora num ponto alto e o herói pende dele. O resgatável (h1) fica
    // sobre a mesma circunferência, então o arco termina exatamente no objeto.
    const A = ancoraTeia(h0, h1);
    const R = Math.hypot(h0.x - A.x, h0.y - A.y);
    const th1 = Math.atan2(h1.y - A.y, h1.x - A.x);
    const fim = { x: A.x + R * Math.cos(th1), y: A.y + R * Math.sin(th1) };
    jogo.ancora = A;
    jogo.arco = { h1: fim, R, th0: Math.atan2(h0.y - A.y, h0.x - A.x), th1 };
    jogo.splatAtivo = true;
    jogo.splatEm = jogo.t + T.teia;
    jogo.splatCentro = A;
    Som.teia();
    entrar(S.TEIA);
  }
  function concluir() {
    jogo.demo = false;
    limparAlvo();
    if (jogo.resgates >= 3) {
      entrar(S.FESTA);
    } else {
      jogo.alvoAtivo = false;
      jogo.alvoCongelado = false;
      jogo.espera = 0;
      entrar(S.ESPERANDO);
    }
  }
  function entrar(novo) {
    jogo.estado = novo;
    jogo.tEstado = 0;
    if (novo === S.ESPERANDO) {
      jogo.ocioso = 0;
    } else if (novo === S.BALANCO) {
      Som.balanco();
    } else if (novo === S.RESGATE) {
      jogo.resgates++;
      acenderEstrela(jogo.resgates - 1);
      Som.resgate(jogo.somAlvo);
      registrarResgate();
      // v1.4 (feature 2): o próximo ciclo começa do outro lado. A virada acontece aqui,
      // depois do balanço, para a volta já pousar no lado novo sem salto de posição.
      jogo.lado ^= 1;
    } else if (novo === S.VOLTA) {
      jogo.faiscasCentro = pontoLocal(26, 148, jogo.arco.h1.x, jogo.arco.h1.y, 0);
      jogo.faiscasAtivas = true;
      jogo.faiscasEm = jogo.t;
      // M1 (v1.2): a gratidão começa na entrada de VOLTA e cabe na própria VOLTA (≤ 600 ms).
      const rec = REACOES[jogo.reacaoAlvo];
      jogo.reacaoEm = jogo.t;
      jogo.reacaoDur = rec ? rec.dur : 0;
      jogo.reacaoAtiva = !!rec;
      Som.gratidao(jogo.tomGrato);
    } else if (novo === S.FESTA) {
      iniciarFesta();
    }
  }

  // ---------- loop ----------
  function passo(dt) {
    jogo.t += dt;
    jogo.tEstado += dt;
    const e = jogo.estado;
    if (e === S.ESPERANDO) {
      jogo.ocioso += dt;
      if (!jogo.alvoAtivo) {
        jogo.espera += dt;
        if (jogo.espera >= T.pausaAlvo) nascerAlvo();
      } else if (jogo.ocioso >= 8000 && !jogo.demo) {
        jogo.demo = true;
        iniciarTeia();
      }
    } else if (e === S.TEIA) {
      if (jogo.tEstado >= T.teia) entrar(S.BALANCO);
    } else if (e === S.BALANCO) {
      if (jogo.tEstado >= jogo.duracaoBalanco) entrar(S.RESGATE);
    } else if (e === S.RESGATE) {
      if (jogo.tEstado >= T.resgate) entrar(S.VOLTA);
    } else if (e === S.VOLTA) {
      if (jogo.tEstado >= T.volta) concluir();
    } else if (e === S.FESTA) {
      if (jogo.tEstado >= 2750 && !jogo.transicao) {
        jogo.transicao = true;
        flash(0.55, 500);
      }
      atualizarConfete(dt);
      if (jogo.tEstado >= T.festa) terminarFesta();
    }
    desenhar();
  }

  function desenhar() {
    const e = jogo.estado, c = layoutAtual();
    desenharEstrelas();
    desenharSplat();
    desenharFaiscas();
    desenharTravesso();

    // M1 (v1.2): progresso da gratidão (0..1) na VOLTA; -1 quando inativa.
    let reacaoP = -1;
    if (jogo.reacaoAtiva) {
      reacaoP = clamp01((jogo.t - jogo.reacaoEm) / jogo.reacaoDur);
      if (reacaoP >= 1) { reacaoP = -1; jogo.reacaoAtiva = false; }
    }

    let hx = c.heroi.x, hy = c.heroi.y, hr = 0;
    let teiaModo = 'pendurada', teiaOp = 0.5, teiaFrac = 1;
    let alvoPos = null;

    if (e === S.ESPERANDO) {
      hr = 2.2 * Math.sin(jogo.t * 0.0013);
      if (jogo.alvoAtivo) {
        const a = posAlvo();
        const p = clamp01((jogo.t - jogo.alvoEntrou) / 320);
        alvoPos = { x: a.x, y: a.y, rot: a.ang, esc: 0.65 + 0.35 * easeOutBack(p), op: clamp01(p * 1.8) };
      }
    } else if (e === S.TEIA) {
      const p = clamp01(jogo.tEstado / T.teia);
      hr = 2.2 * Math.sin(jogo.t * 0.0013) * (1 - p);
      teiaModo = 'ancora'; teiaOp = 0.9; teiaFrac = easeOutCubic(p);
      alvoPos = { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, rot: jogo.alvoAngulo, esc: 1, op: 1 };
    } else if (e === S.BALANCO) {
      const p = clamp01(jogo.tEstado / jogo.duracaoBalanco);
      const t = easeInOutCubic(p);
      // v1.4.1: pêndulo em torno da âncora — o herói desce, cruza o fundo da ferradura e
      // sobe até o resgatável, com a teia sempre esticada do pivô até ele.
      const a = jogo.arco;
      const ang = lerp(a.th0, a.th1, t);
      hx = jogo.ancora.x + a.R * Math.cos(ang);
      hy = jogo.ancora.y + a.R * Math.sin(ang);
      hr = 14 * Math.sin(Math.PI * p);
      teiaModo = 'ancora'; teiaOp = 0.9;
      alvoPos = { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, rot: jogo.alvoAngulo, esc: 1, op: 1 };
    } else if (e === S.RESGATE) {
      const p = clamp01(jogo.tEstado / T.resgate);
      hx = jogo.arco.h1.x;
      hy = jogo.arco.h1.y + 8 * Math.sin(Math.PI * p);
      teiaModo = 'ancora'; teiaOp = 0.9 * (1 - p);
      const peito = pontoLocal(26, 148, hx, hy, 0);
      const t = easeInOutCubic(p);
      const ax = bez(jogo.alvoCentro.x, jogo.alvoCentro.x + 96, peito.x, t);
      const ay = bez(jogo.alvoCentro.y, jogo.alvoCentro.y + 42, peito.y, t);
      alvoPos = { x: ax, y: ay, rot: lerp(jogo.alvoAngulo, -8, t), esc: lerp(1, 0.86, t), op: 1 };
    } else if (e === S.VOLTA) {
      const p = clamp01(jogo.tEstado / T.volta);
      const t = easeInOutCubic(p);
      // v1.4 (feature 2): a volta pousa no lado NOVO — o herói já virou para lá no
      // resgate —, então ela é um reposicionamento curto, não a travessia de volta.
      const destino = layoutAtual().heroi;
      const cx = (jogo.arco.h1.x + destino.x) / 2;
      const cy = (jogo.arco.h1.y + destino.y) / 2 + 170;
      hx = bez(jogo.arco.h1.x, cx, destino.x, t);
      hy = bez(jogo.arco.h1.y, cy, destino.y, t);
      hr = -12 * Math.sin(Math.PI * p);
      teiaModo = 'none';
      const peito = pontoLocal(26, 148, hx, hy, hr);
      // M1 (v1.2): destaque da gratidão — o resgatado sobe e cresce à frente do herói
      // enquanto reage, para o gesto não se perder no balanço de volta.
      const dp = reacaoP >= 0 ? envoltoria(reacaoP) : 0;
      alvoPos = {
        x: peito.x,
        y: peito.y - 92 * dp,
        rot: -8,
        esc: lerp(0.86, 1.4, dp),
        op: 1 - clamp01((p - 0.88) / 0.12),
      };
    } else if (e === S.FESTA) {
      const hop = Math.abs(Math.sin(Math.PI * jogo.tEstado / 1000));
      hy = c.heroi.y - 44 * hop;
      hr = 5 * Math.sin(2 * Math.PI * jogo.tEstado / 1000);
      teiaModo = 'pendurada'; teiaOp = 0.5;
    }

    if (reacaoP >= 0) {
      hy += -34 * Math.sin(Math.PI * reacaoP);    // pulinho
      hr += 12 * Math.sin(reacaoP * Math.PI * 2); // inclinação de aceno
    }
    def(el.heroi, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${hr.toFixed(2)})`);

    if (teiaModo === 'pendurada') {
      const len = Math.max(1, hy + 80);
      def(el.linha, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(-90) scale(${len.toFixed(2)} 1)`);
      def(el.linha, 'opacity', teiaOp);
    } else if (teiaModo === 'ancora') {
      const dx = jogo.ancora.x - hx, dy = jogo.ancora.y - hy;
      const len = Math.max(0.01, Math.hypot(dx, dy) * teiaFrac);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      def(el.linha, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${ang.toFixed(2)}) scale(${len.toFixed(2)} 1)`);
      def(el.linha, 'opacity', teiaOp);
    } else {
      def(el.linha, 'opacity', 0);
    }

    if (alvoPos) {
      def(el.alvo, 'transform', `translate(${alvoPos.x.toFixed(2)} ${alvoPos.y.toFixed(2)}) rotate(${alvoPos.rot.toFixed(2)}) scale(${alvoPos.esc.toFixed(3)})`);
      def(el.alvo, 'opacity', alvoPos.op.toFixed(3));
    } else {
      def(el.alvo, 'opacity', 0);
    }

    // M1 (v1.2): reação do resgatado num nó de arte já existente (0 nós novos).
    if (el.alvoArte) {
      const rec = REACOES[jogo.reacaoAlvo];
      if (reacaoP >= 0 && rec) def(el.alvoArte, 'transform', rec.obj(reacaoP));
      else def(el.alvoArte, 'transform', '');
    }

    const podeCorda = c.cordaAlvo && alvoPos && (e === S.ESPERANDO || e === S.TEIA || e === S.BALANCO);
    if (podeCorda) {
      const p = pontoLocal(c.cordaAlvo.x, c.cordaAlvo.y, alvoPos.x, alvoPos.y, alvoPos.rot);
      const dx = p.x - c.ancorAlvo.x, dy = p.y - c.ancorAlvo.y;
      const len = Math.max(0.01, Math.hypot(dx, dy));
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      def(el.corda, 'transform', `translate(${c.ancorAlvo.x} ${c.ancorAlvo.y}) rotate(${ang.toFixed(2)}) scale(${len.toFixed(2)} 1)`);
      def(el.corda, 'opacity', (0.7 * alvoPos.op).toFixed(3));
    } else {
      def(el.corda, 'opacity', 0);
    }

    if (jogo.flashEm >= 0) {
      const p = clamp01((jogo.t - jogo.flashEm) / jogo.flashDur);
      def(el.flash, 'opacity', (jogo.flashPico * Math.sin(Math.PI * p)).toFixed(3));
      if (p >= 1) jogo.flashEm = -1;
    } else {
      def(el.flash, 'opacity', 0);
    }

    if (jogo.mudoAvisoEm >= 0) {
      const p = clamp01((jogo.t - jogo.mudoAvisoEm) / 1000);
      const op = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
      def(el.mudoIcone, 'opacity', op.toFixed(3));
      if (p >= 1) jogo.mudoAvisoEm = -1;
    } else {
      def(el.mudoIcone, 'opacity', 0);
    }
    def(el.mudoRisco, 'opacity', jogo.mudo ? 1 : 0);
  }

  // ---------- entrada ----------
  function paraVirtual(ev) {
    const ctm = el.svg.getScreenCTM();
    if (!ctm) return null;
    const pt = el.svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return null;
    return p;
  }
  function aoClicar(ev) {
    if (ev.button !== 0) return;
    if (jogo.estado !== S.ESPERANDO || !jogo.alvoAtivo) return;
    const p = paraVirtual(ev);
    if (!p) return;
    const a = posAlvo();
    const noCirculo = Math.hypot(p.x - a.x, p.y - a.y) <= RAIO;
    const noTerco = p.x >= TERCO.x1 && p.x <= TERCO.x2 && p.y >= TERCO.y1 && p.y <= TERCO.y2;
    if (!noCirculo && !noTerco) return;
    iniciarTeia();
  }

  // ---------- attract mode + teclas do adulto ----------
  function cancelarDemo() {
    if (!jogo.demo) return false;
    jogo.demo = false;
    if (jogo.estado !== S.ESPERANDO) {
      jogo.alvoAtivo = false;
      jogo.alvoCongelado = false;
      limparAlvo();
      jogo.espera = 0;
      jogo.splatAtivo = false;
      jogo.faiscasAtivas = false;
      jogo.travesso.ativo = false;
      entrar(S.ESPERANDO);
    }
    return true;
  }
  function aoEntrada() {
    jogo.ocioso = 0;
    cancelarDemo();
  }
  function alternarMudo() {
    jogo.mudo = !jogo.mudo;
    Som.definirMudo(jogo.mudo);
    jogo.mudoAvisoEm = jogo.t;
  }
  // Padrão da casa (PADRAES.md): no celular o jogo entra em tela cheia no
  // primeiro toque — sem duplo-toque. A API de fullscreen exige gesto do
  // usuário: o carregamento tenta (funciona em PWA/"Adicionar à Tela de
  // Início" e onde o navegador permitir sem gesto) e o primeiro pointerdown
  // de toque garante. Desktop (mouse) continua com a tecla `F`. Onde a API
  // não existe (iPhone), o gesto é inócuo — nada quebra.
  const ehCelular = () => !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  function entrarTelaCheia() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      const p = req.call(el);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function alternarTela() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        entrarTelaCheia();
      } else {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  function aoToque(ev) {
    if (ev.pointerType !== 'touch') return;
    entrarTelaCheia();
  }
  function aoTeclar(ev) {
    jogo.ocioso = 0;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key;
    if (k === 'm' || k === 'M') { alternarMudo(); ev.preventDefault(); }
    else if (k === 'f' || k === 'F') { alternarTela(); ev.preventDefault(); }
  }

  document.addEventListener('pointerdown', Som.destravar, { capture: true, passive: true });
  document.addEventListener('pointerdown', aoEntrada, { capture: true, passive: true });
  el.svg.addEventListener('pointerdown', aoClicar);
  el.svg.addEventListener('contextmenu', ev => ev.preventDefault());
  document.addEventListener('keydown', aoTeclar);
  document.addEventListener('pointerdown', aoToque, { passive: true });
  window.addEventListener('resize', atualizarEscalaPlacar);
  window.addEventListener('orientationchange', atualizarEscalaPlacar);

  montarPlacar();
  montarCenario(0);
  montarAlvo();
  if (ehCelular()) entrarTelaCheia();
  iniciarTravesso();
  let anterior = performance.now();
  function quadro(agora) {
    const dt = Math.min(100, Math.max(0, agora - anterior));
    anterior = agora;
    passo(dt);
    requestAnimationFrame(quadro);
  }
  desenhar();
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
