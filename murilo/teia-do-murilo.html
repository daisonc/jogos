<script>
'use strict';
(() => {
  const W = 1920, H = 1080;
  const S = Object.freeze({ ESPERANDO:'esperando', TEIA:'teia', BALANCO:'balanco', RESGATE:'resgate', VOLTA:'volta', FESTA:'festa' });
  const T = Object.freeze({ teia:250, resgate:500, volta:600, festa:3000, pausaAlvo:400, brilho:420 });
  const BALANCOS = [1500, 1380, 1620];
  const RAIO = 220;
  const TERCO = { x1: W*0.3, x2: W*0.7, y1: H*0.25, y2: H*0.75 };

  // Cada cenÃ¡rio Ã© dados: arte (template), posiÃ§Ãµes, corda e rota do Duende.
  // Regra de L7/US4: |duende.x0 - heroi.x| >= 0.6 * 1920 = 1152.
  const CENARIOS = [
    {
      id: 'telhados',
      ancorAlvo: { x: 1300, y: 396 },
      centroAlvo: { x: 8, y: 124 },
      heroi: { x: 430, y: 250 },
      cordaAlvo: { x: 0, y: -52 },
      duende: { x0: 1600, y0: 190, x1: 2050, y1: 130, dur: 1800, escala: 1 },
      som: 'miau',
    },
    {
      id: 'parque',
      ancorAlvo: { x: 1450, y: 380 },
      centroAlvo: { x: 4, y: 120 },
      heroi: { x: 360, y: 280 },
      cordaAlvo: { x: 0, y: -40 },
      duende: { x0: 1580, y0: 210, x1: 2040, y1: 150, dur: 1800, escala: 1 },
      som: 'ploc',
    },
    {
      id: 'rua',
      ancorAlvo: { x: 1320, y: 838 },
      centroAlvo: { x: 0, y: -44 },
      heroi: { x: 430, y: 300 },
      cordaAlvo: null,
      duende: { x0: 1600, y0: 180, x1: 2050, y1: 120, dur: 1800, escala: 1 },
      som: 'latido',
    },
  ];

  const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
  const lerp = (a,b,t) => a + (b-a)*t;
  const easeOutCubic = t => 1 - Math.pow(1-t, 3);
  const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const bez = (a,b,c,t) => (1-t)*(1-t)*a + 2*(1-t)*t*b + t*t*c;
  const $ = id => document.getElementById(id);

  // Cache de atributos: evita reescrever o DOM quando o valor não mudou.
  // Em repouso (e boa parte do movimento) quase nenhuma escrita acontece.
  const cacheAtrib = new WeakMap();
  function def(obj, nome, valor) {
    const s = String(valor);
    let m = cacheAtrib.get(obj);
    if (m === undefined) { m = Object.create(null); cacheAtrib.set(obj, m); }
    if (m[nome] === s) return;
    m[nome] = s;
    obj.setAttribute(nome, s);
  }

  function girar(px, py, deg) {
    const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return { x: px*c - py*s, y: px*s + py*c };
  }
  function pontoLocal(lx, ly, hx, hy, rot) {
    const p = girar(lx, ly, rot);
    return { x: hx + p.x, y: hy + p.y };
  }
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- Ã¡udio: 100% sintetizado, sem arquivo e sem rede ----------
  const Som = (() => {
    let ctx = null, mestre = null, ruido = null, timer = null;
    let proxNota = 0, notaIdx = 0, mudo = false;
    const MELODIA = [880, 1108.73, 1318.51, 1760, 1318.51, 1108.73, 987.77, 880];
    const PASSO = 0.9;

    function criarRuido(c) {
      const b = c.createBuffer(1, Math.floor(c.sampleRate * 0.7), c.sampleRate);
      const d = b.getChannelData(0);
      let s = 0x2F6E2B1;
      for (let i = 0; i < d.length; i++) {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        d[i] = ((s >>> 0) / 4294967296) * 2 - 1;
      }
      return b;
    }
    function envelope(g, t0, pico, ataque, dur) {
      const p = Math.max(0.0002, pico);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(p, t0 + Math.max(0.002, ataque));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    function nota(t0, f, pico, dur, tipo) {
      if (!ctx) return;
      const o = ctx.createOscillator();
      o.type = tipo || 'sine';
      o.frequency.value = f;
      const g = ctx.createGain();
      envelope(g, t0, pico, Math.min(0.03, dur * 0.25), dur);
      o.connect(g); g.connect(mestre);
      o.start(t0); o.stop(t0 + dur + 0.05);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function ruidoFonte() {
      const src = ctx.createBufferSource();
      src.buffer = ruido;
      src.loop = true;
      return src;
    }
    function iniciarPad() {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = 0.5;
      const g = ctx.createGain(); g.gain.value = 0.05;
      f.connect(g); g.connect(mestre);
      [110, 164.81, 220].forEach((fr, i) => {
        const o = ctx.createOscillator();
        o.type = i === 2 ? 'sine' : 'triangle';
        o.frequency.value = fr;
        o.detune.value = i === 0 ? -5 : i === 1 ? 5 : 0;
        o.connect(f); o.start();
      });
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05;
      const lg = ctx.createGain(); lg.gain.value = 160;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    }
    function agendar() {
      if (!ctx || ctx.state !== 'running' || mudo) return;
      const limite = ctx.currentTime + 2;
      while (proxNota < limite) {
        nota(proxNota, MELODIA[notaIdx % MELODIA.length], 0.07, 1.6, 'sine');
        proxNota += PASSO;
        notaIdx++;
      }
    }
    function novoContexto() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        const c = new AC();
        const m = c.createGain();
        m.gain.value = mudo ? 0.0001 : 0.251; // -12 dBFS (ou mudo)
        const l = c.createDynamicsCompressor();
        l.threshold.value = -6;
        l.knee.value = 0;
        l.ratio.value = 20;
        l.attack.value = 0.003;
        l.release.value = 0.25;
        m.connect(l); l.connect(c.destination);
        ctx = c; mestre = m;
        ruido = criarRuido(c);
        iniciarPad();
        proxNota = c.currentTime + 1.2;
        timer = setInterval(agendar, 500);
        return c;
      } catch (e) {
        return null;
      }
    }
    function destravar() {
      if (!ctx && !novoContexto()) return;
      if (ctx.state === 'suspended') {
        const p = ctx.resume();
        if (p && p.catch) p.catch(() => {});
      }
    }
    function agora() { return ctx ? ctx.currentTime : 0; }

    function teia() {
      if (!ctx) return;
      const t0 = agora();
      const src = ruidoFonte();
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 2600; f.Q.value = 0.7;
      const g = ctx.createGain();
      envelope(g, t0, 0.55, 0.006, 0.09);
      src.connect(f); f.connect(g); g.connect(mestre);
      src.start(t0); src.stop(t0 + 0.12);
      src.onended = () => { try { src.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function balanco() {
      if (!ctx) return;
      const t0 = agora();
      const src = ruidoFonte();
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 0.8;
      f.frequency.setValueAtTime(380, t0);
      f.frequency.exponentialRampToValueAtTime(1500, t0 + 0.5);
      f.frequency.exponentialRampToValueAtTime(520, t0 + 1.05);
      const g = ctx.createGain();
      envelope(g, t0, 0.6, 0.24, 1.15);
      src.connect(f); f.connect(g); g.connect(mestre);
      src.start(t0); src.stop(t0 + 1.18);
      src.onended = () => { try { src.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function pop(t0) {
      if (!ctx) return;
      const q = t0 ?? agora();
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(480, q);
      o.frequency.exponentialRampToValueAtTime(170, q + 0.12);
      const g = ctx.createGain();
      envelope(g, q, 0.45, 0.006, 0.14);
      o.connect(g); g.connect(mestre);
      o.start(q); o.stop(q + 0.16);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function miau(q) {
      if (!ctx) return;
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(760, q);
      o.frequency.exponentialRampToValueAtTime(1080, q + 0.07);
      o.frequency.exponentialRampToValueAtTime(820, q + 0.2);
      o.frequency.exponentialRampToValueAtTime(690, q + 0.34);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 2600;
      const g = ctx.createGain();
      envelope(g, q, 0.38, 0.02, 0.38);
      o.connect(f); f.connect(g); g.connect(mestre);
      o.start(q); o.stop(q + 0.4);
      o.onended = () => { try { o.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function ploc(q) {
      if (!ctx) return;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(300, q);
      o.frequency.exponentialRampToValueAtTime(95, q + 0.09);
      const g = ctx.createGain();
      envelope(g, q, 0.45, 0.005, 0.11);
      o.connect(g); g.connect(mestre);
      o.start(q); o.stop(q + 0.13);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
    }
    function latido(q) {
      if (!ctx) return;
      for (let i = 0; i < 2; i++) {
        const t0 = q + i * 0.14;
        const o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(260, t0);
        o.frequency.exponentialRampToValueAtTime(150, t0 + 0.07);
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = 950;
        const g = ctx.createGain();
        envelope(g, t0, 0.32, 0.005, 0.08);
        o.connect(f); f.connect(g); g.connect(mestre);
        o.start(t0); o.stop(t0 + 0.1);
        o.onended = () => { try { o.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
      }
    }
    function ihihi() {
      if (!ctx) return;
      const base = agora();
      [1250, 1550, 1900].forEach((fr, i) => {
        const t0 = base + i * 0.065;
        const o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(fr, t0);
        o.frequency.exponentialRampToValueAtTime(fr * 1.08, t0 + 0.05);
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = 4600;
        const g = ctx.createGain();
        envelope(g, t0, 0.16, 0.004, 0.062);
        o.connect(f); f.connect(g); g.connect(mestre);
        o.start(t0); o.stop(t0 + 0.08);
        o.onended = () => { try { o.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
      });
    }
    function festa() {
      if (!ctx) return;
      const q = agora() + 0.02;
      const NOTAS = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1046.5, 783.99, 1046.5];
      nota(q, 261.63, 0.2, 0.8, 'sine');
      NOTAS.forEach((f, i) => {
        const t0 = q + i * 0.16;
        nota(t0, f, 0.15, 0.44, 'triangle');
        nota(t0, f * 2, 0.045, 0.3, 'sine');
      });
    }
    function resgate(som) {
      if (!ctx) return;
      const q = agora() + 0.01;
      pop(q);
      if (som === 'miau') miau(q + 0.07);
      else if (som === 'ploc') ploc(q + 0.07);
      else if (som === 'latido') latido(q + 0.07);
    }
    function definirMudo(on) {
      mudo = !!on;
      if (!ctx || !mestre) return;
      const g = mestre.gain, t = ctx.currentTime;
      try { g.cancelScheduledValues(t); } catch (e) {}
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(mudo ? 0.0001 : 0.251, t + 0.03);
    }
    return { destravar, teia, balanco, resgate, festa, ihihi, definirMudo };
  })();

  // ---------- elementos ----------
  const el = {
    svg: $('palco'), cenario: $('cenario'), duende: $('duende'),
    linha: $('linha-teia'), corda: $('corda-alvo'),
    heroi: $('heroi'), alvo: $('alvo'), splat: $('splat'),
    faiscas: [...document.querySelectorAll('#faiscas path')],
    estrelas: [...document.querySelectorAll('#estrelas .estrela')],
    halos: [...document.querySelectorAll('#estrelas .halo')],
    confete: $('confete'), flash: $('flash'),
    mudoIcone: $('mudo-icone'), mudoRisco: $('mudo-risco'),
  };

  // ---------- cenÃ¡rio: montado a partir de template (sÃ³ um por vez) ----------
  const DISTANTE = [[120,90],[70,130],[150,70],[90,160],[130,110],[80,60],[140,100],[100,140],[120,80],[90,120],[160,90],[110,70],[130,130],[90,60],[120,100],[80,140],[140,110],[100,90],[120,150],[90,80],[130,100],[150,90],[100,120],[130,70]];
  const MEDIA = [[180,150],[120,220],[200,90],[140,260],[160,120],[120,180],[220,140],[180,200],[160,100],[200,170],[140,90],[100,130],[180,190],[150,110],[200,160],[170,120]];

  function fatorVale(cx, vale) {
    const d = cx - vale.x;
    return 1 - 0.62 * Math.exp(-(d*d) / (2 * vale.r * vale.r));
  }
  function gerarSkyline(baseY, gap, edif, vale) {
    let x = -40, d = `M-40 ${baseY}`;
    for (const [w, h] of edif) {
      if (x > 1960) break;
      const hh = h * fatorVale(x + w/2, vale);
      d += ` L${x} ${baseY} L${x} ${(baseY-hh).toFixed(1)} L${x+w} ${(baseY-hh).toFixed(1)} L${x+w} ${baseY}`;
      x += w + gap;
    }
    return d + ` L1960 ${baseY} L1960 1090 L-40 1090 Z`;
  }
  function clonarTemplate(id) {
    const tpl = $(id);
    if (!tpl) return null;
    const svg = tpl.content.firstElementChild;
    return svg ? svg.firstElementChild.cloneNode(true) : null;
  }
  function montarCenario(i) {
    const c = CENARIOS[i];
    const cena = clonarTemplate('tpl-cena-' + c.id);
    if (cena) {
      el.cenario.replaceChildren(cena);
      const sd = cena.querySelector('.skyline-distante');
      if (sd) sd.setAttribute('d', gerarSkyline(862, 18, DISTANTE, { x:1010, r:300 }));
      const sm = cena.querySelector('.skyline-media');
      if (sm) sm.setAttribute('d', gerarSkyline(930, 26, MEDIA, { x:1010, r:340 }));
    }
    const alvo = clonarTemplate('tpl-alvo-' + c.id);
    if (alvo) el.alvo.replaceChildren(alvo);
  }

  // ---------- confete (nÃ³s prÃ©-criados; sÃ³ transform/opacity) ----------
  const CORES_CONFETE = ['#FFD166','#F26D5B','#4ECDC4','#FFF4E0','#B39DDB'];
  const confete = [];
  for (let i = 0; i < 20; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', 9 + (i % 3) * 3);
    r.setAttribute('height', 15);
    r.setAttribute('rx', 2);
    r.setAttribute('fill', CORES_CONFETE[i % CORES_CONFETE.length]);
    r.setAttribute('opacity', 0);
    el.confete.appendChild(r);
    confete.push({ el: r, x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, ativo: false });
  }

  // ---------- estado ----------
  const jogo = {
    estado: S.ESPERANDO, t: 0, tEstado: 0,
    cenario: 0, resgates: 0, festas: 0,
    alvoAtivo: true, alvoCongelado: false, alvoEntrou: 0,
    espera: 0, duracaoBalanco: BALANCOS[0],
    alvoCentro: { x: 0, y: 0 }, alvoAngulo: 0,
    arco: null,
    splatAtivo: false, splatEm: 0,
    faiscasAtivas: false, faiscasEm: 0, faiscasCentro: { x: 0, y: 0 },
    flashEm: -1, flashPico: 0, flashDur: 700,
    transicao: false,
    ocioso: 0, demo: false, mudo: false, mudoAvisoEm: -1,
    duende: { ativo: false, inicio: 0, x0: 0, y0: 0, x1: 0, y1: 0, dur: 1800, escala: 1 },
  };
  const estadoEstrelas = [0,1,2].map(() => ({ acesa: false, acendeuEm: -1, apagouEm: -1 }));

  const cenarioAtual = () => CENARIOS[jogo.cenario];

  function posAlvo() {
    const c = cenarioAtual();
    if (jogo.alvoCongelado) return { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, ang: jogo.alvoAngulo };
    const ang = 2.4 * Math.sin(jogo.t * 0.0014 + 1.2);
    const p = girar(c.centroAlvo.x, c.centroAlvo.y, ang);
    return { x: c.ancorAlvo.x + p.x, y: c.ancorAlvo.y + p.y, ang };
  }

  // ---------- estrelas ----------
  function acenderEstrela(i) {
    const st = estadoEstrelas[i];
    if (!st) return;
    st.acesa = true;
    st.acendeuEm = jogo.t;
    st.apagouEm = -1;
  }
  function apagarEstrelas() {
    for (const st of estadoEstrelas) {
      if (st.acesa) st.apagouEm = jogo.t;
      st.acesa = false;
    }
  }
  function desenharEstrelas() {
    for (let i = 0; i < 3; i++) {
      const st = estadoEstrelas[i], node = el.estrelas[i], halo = el.halos[i];
      let op = 0.36, haloOp = 0, esc = 1;
      if (st.acesa) {
        const p = clamp01((jogo.t - st.acendeuEm) / T.brilho);
        const ep = easeOutCubic(p);
        op = lerp(0.36, 1, ep);
        haloOp = 0.85 * ep;
        esc = 1 + 0.55 * (1 - ep);
        if (jogo.estado === S.FESTA) {
          const pulso = Math.sin(jogo.t * 0.008 + i * 1.4);
          esc *= 1 + 0.07 * pulso;
          haloOp *= 1 + 0.18 * pulso;
        }
      } else if (st.apagouEm >= 0) {
        const p = clamp01((jogo.t - st.apagouEm) / 300);
        op = lerp(1, 0.36, p);
        haloOp = 0.85 * (1 - p);
        if (p >= 1) st.apagouEm = -1;
      }
      def(node, 'opacity', op.toFixed(3));
      def(node, 'transform', `translate(${960 + (i - 1) * 72} 1038) scale(${esc.toFixed(3)})`);
      def(halo, 'opacity', Math.max(0, haloOp).toFixed(3));
    }
  }

  function desenharSplat() {
    if (!jogo.splatAtivo) { def(el.splat, 'opacity', 0); return; }
    const d = jogo.t - jogo.splatEm;
    if (d < 0) { def(el.splat, 'opacity', 0); return; }
    const p = clamp01(d / 300);
    def(el.splat, 'transform', `translate(${jogo.alvoCentro.x.toFixed(2)} ${jogo.alvoCentro.y.toFixed(2)}) scale(${(1 + 0.25 * p).toFixed(3)})`);
    def(el.splat, 'opacity', (0.95 * (1 - p)).toFixed(3));
    if (p >= 1) jogo.splatAtivo = false;
  }

  function desenharFaiscas() {
    if (!jogo.faiscasAtivas) {
      for (const f of el.faiscas) def(f, 'opacity', 0);
      return;
    }
    const p = clamp01((jogo.t - jogo.faiscasEm) / 450);
    for (let i = 0; i < el.faiscas.length; i++) {
      const a = (i / el.faiscas.length) * Math.PI * 2 + 0.5;
      const dist = 12 + 58 * easeOutCubic(p);
      const x = jogo.faiscasCentro.x + Math.cos(a) * dist;
      const y = jogo.faiscasCentro.y + Math.sin(a) * dist;
      const s = 0.45 + 0.75 * Math.sin(Math.PI * p);
      def(el.faiscas[i], 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${Math.max(0, s).toFixed(3)})`);
      def(el.faiscas[i], 'opacity', ((1 - p) * 0.95).toFixed(3));
    }
    if (p >= 1) jogo.faiscasAtivas = false;
  }

  // ---------- Duende: sempre longe, de costas, fugindo ----------
  function iniciarDuende() {
    const c = cenarioAtual(), d = jogo.duende, cfg = c.duende;
    d.ativo = true; d.inicio = jogo.t;
    d.x0 = cfg.x0; d.y0 = cfg.y0; d.x1 = cfg.x1; d.y1 = cfg.y1;
    d.dur = cfg.dur; d.escala = cfg.escala;
    Som.ihihi();
  }
  function desenharDuende() {
    const d = jogo.duende;
    if (!d.ativo) { def(el.duende, 'opacity', 0); return; }
    const p = clamp01((jogo.t - d.inicio) / d.dur);
    const e = easeInOutCubic(p);
    const x = lerp(d.x0, d.x1, e);
    const y = lerp(d.y0, d.y1, e) + Math.sin(p * Math.PI * 2.2) * 5;
    const banco = Math.sin(p * Math.PI * 1.6) * 5 - 2;
    const op = p < 0.08 ? p / 0.08 : p > 0.88 ? (1 - p) / 0.12 : 1;
    def(el.duende, 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${banco.toFixed(2)}) scale(${d.escala})`);
    def(el.duende, 'opacity', Math.max(0, op).toFixed(3));
    if (p >= 1) d.ativo = false;
  }

  // ---------- festa ----------
  function flash(pico, dur) {
    jogo.flashEm = jogo.t;
    jogo.flashPico = pico;
    jogo.flashDur = dur;
  }
  function iniciarFesta() {
    jogo.festas++;
    flash(0.13, 700);
    Som.festa();
    const rnd = mulberry32(0x51ED270B ^ (jogo.festas * 7919) ^ (jogo.cenario * 104729));
    for (const c of confete) {
      c.x = rnd() * W;
      c.y = -30 - rnd() * 520;
      c.vx = (rnd() - 0.5) * 140;
      c.vy = 260 + rnd() * 280;
      c.r = rnd() * 360;
      c.vr = (rnd() - 0.5) * 440;
      c.ativo = true;
      def(c.el, 'opacity', 1);
    }
  }
  function atualizarConfete(dt) {
    const s = dt / 1000;
    for (const c of confete) {
      if (!c.ativo) continue;
      c.vy += 260 * s;
      c.x += (c.vx + Math.sin((jogo.t + c.r * 13) * 0.0018) * 34) * s;
      c.y += c.vy * s;
      c.r += c.vr * s;
      if (c.y > 1120) { c.ativo = false; def(c.el, 'opacity', 0); continue; }
      def(c.el, 'transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.r.toFixed(1)})`);
    }
  }
  function terminarFesta() {
    apagarEstrelas();
    for (const c of confete) { c.ativo = false; def(c.el, 'opacity', 0); }
    jogo.resgates = 0;
    jogo.transicao = false;
    jogo.cenario = (jogo.cenario + 1) % CENARIOS.length;
    jogo.alvoAtivo = false;
    jogo.alvoCongelado = false;
    jogo.espera = 0;
    jogo.splatAtivo = false;
    jogo.duende.ativo = false;
    montarCenario(jogo.cenario);
    entrar(S.ESPERANDO);
  }

  // ---------- transiÃ§Ãµes ----------
  function nascerAlvo() {
    jogo.alvoAtivo = true;
    jogo.alvoCongelado = false;
    jogo.espera = 0;
    jogo.alvoEntrou = jogo.t;
    jogo.splatAtivo = false;
    def(el.splat, 'opacity', 0);
    iniciarDuende();
  }
  function iniciarTeia() {
    const a = posAlvo();
    jogo.alvoCentro = { x: a.x, y: a.y };
    jogo.alvoAngulo = a.ang;
    jogo.alvoCongelado = true;
    jogo.duracaoBalanco = BALANCOS[jogo.resgates % 3];
    const h0 = { x: cenarioAtual().heroi.x, y: cenarioAtual().heroi.y };
    const h1 = { x: a.x - 28, y: a.y - 26 };
    jogo.arco = { h0, h1, c: { x: (h0.x + h1.x) / 2, y: (h0.y + h1.y) / 2 + 430 } };
    jogo.splatAtivo = true;
    jogo.splatEm = jogo.t + T.teia;
    Som.teia();
    entrar(S.TEIA);
  }
  function concluir() {
    jogo.demo = false;
    if (jogo.resgates >= 3) {
      entrar(S.FESTA);
    } else {
      jogo.alvoAtivo = false;
      jogo.alvoCongelado = false;
      jogo.espera = 0;
      entrar(S.ESPERANDO);
    }
  }
  function entrar(novo) {
    jogo.estado = novo;
    jogo.tEstado = 0;
    if (novo === S.ESPERANDO) {
      jogo.ocioso = 0;
    } else if (novo === S.BALANCO) {
      Som.balanco();
    } else if (novo === S.RESGATE) {
      jogo.resgates++;
      acenderEstrela(jogo.resgates - 1);
      Som.resgate(cenarioAtual().som);
    } else if (novo === S.VOLTA) {
      jogo.faiscasCentro = pontoLocal(26, 148, jogo.arco.h1.x, jogo.arco.h1.y, 0);
      jogo.faiscasAtivas = true;
      jogo.faiscasEm = jogo.t;
    } else if (novo === S.FESTA) {
      iniciarFesta();
    }
  }

  // ---------- loop ----------
  function passo(dt) {
    jogo.t += dt;
    jogo.tEstado += dt;
    const e = jogo.estado;
    if (e === S.ESPERANDO) {
      jogo.ocioso += dt;
      if (!jogo.alvoAtivo) {
        jogo.espera += dt;
        if (jogo.espera >= T.pausaAlvo) nascerAlvo();
      } else if (jogo.ocioso >= 8000 && !jogo.demo) {
        jogo.demo = true;
        iniciarTeia();
      }
    } else if (e === S.TEIA) {
      if (jogo.tEstado >= T.teia) entrar(S.BALANCO);
    } else if (e === S.BALANCO) {
      if (jogo.tEstado >= jogo.duracaoBalanco) entrar(S.RESGATE);
    } else if (e === S.RESGATE) {
      if (jogo.tEstado >= T.resgate) entrar(S.VOLTA);
    } else if (e === S.VOLTA) {
      if (jogo.tEstado >= T.volta) concluir();
    } else if (e === S.FESTA) {
      if (jogo.tEstado >= 2750 && !jogo.transicao) {
        jogo.transicao = true;
        flash(0.55, 500);
      }
      atualizarConfete(dt);
      if (jogo.tEstado >= T.festa) terminarFesta();
    }
    desenhar();
  }

  function desenhar() {
    const e = jogo.estado, c = cenarioAtual();
    desenharEstrelas();
    desenharSplat();
    desenharFaiscas();
    desenharDuende();

    let hx = c.heroi.x, hy = c.heroi.y, hr = 0;
    let teiaModo = 'pendurada', teiaOp = 0.5, teiaFrac = 1;
    let alvoPos = null;

    if (e === S.ESPERANDO) {
      hr = 2.2 * Math.sin(jogo.t * 0.0013);
      if (jogo.alvoAtivo) {
        const a = posAlvo();
        const p = clamp01((jogo.t - jogo.alvoEntrou) / 320);
        alvoPos = { x: a.x, y: a.y, rot: a.ang, esc: 0.65 + 0.35 * easeOutBack(p), op: clamp01(p * 1.8) };
      }
    } else if (e === S.TEIA) {
      const p = clamp01(jogo.tEstado / T.teia);
      hr = 2.2 * Math.sin(jogo.t * 0.0013) * (1 - p);
      teiaModo = 'alvo'; teiaOp = 0.9; teiaFrac = easeOutCubic(p);
      alvoPos = { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, rot: jogo.alvoAngulo, esc: 1, op: 1 };
    } else if (e === S.BALANCO) {
      const p = clamp01(jogo.tEstado / jogo.duracaoBalanco);
      const t = easeInOutCubic(p);
      hx = bez(jogo.arco.h0.x, jogo.arco.c.x, jogo.arco.h1.x, t);
      hy = bez(jogo.arco.h0.y, jogo.arco.c.y, jogo.arco.h1.y, t);
      hr = 14 * Math.sin(Math.PI * p);
      teiaModo = 'alvo'; teiaOp = 0.9;
      alvoPos = { x: jogo.alvoCentro.x, y: jogo.alvoCentro.y, rot: jogo.alvoAngulo, esc: 1, op: 1 };
    } else if (e === S.RESGATE) {
      const p = clamp01(jogo.tEstado / T.resgate);
      hx = jogo.arco.h1.x;
      hy = jogo.arco.h1.y + 8 * Math.sin(Math.PI * p);
      teiaModo = 'alvo'; teiaOp = 0.9 * (1 - p);
      const peito = pontoLocal(26, 148, hx, hy, 0);
      const t = easeInOutCubic(p);
      const ax = bez(jogo.alvoCentro.x, jogo.alvoCentro.x + 96, peito.x, t);
      const ay = bez(jogo.alvoCentro.y, jogo.alvoCentro.y + 42, peito.y, t);
      alvoPos = { x: ax, y: ay, rot: lerp(jogo.alvoAngulo, -8, t), esc: lerp(1, 0.86, t), op: 1 };
    } else if (e === S.VOLTA) {
      const p = clamp01(jogo.tEstado / T.volta);
      const t = easeInOutCubic(p);
      hx = bez(jogo.arco.h1.x, jogo.arco.c.x, jogo.arco.h0.x, t);
      hy = bez(jogo.arco.h1.y, jogo.arco.c.y, jogo.arco.h0.y, t);
      hr = -12 * Math.sin(Math.PI * p);
      teiaModo = 'none';
      const peito = pontoLocal(26, 148, hx, hy, hr);
      alvoPos = { x: peito.x, y: peito.y, rot: -8, esc: 0.86, op: 1 - clamp01((p - 0.72) / 0.28) };
    } else if (e === S.FESTA) {
      const hop = Math.abs(Math.sin(Math.PI * jogo.tEstado / 1000));
      hy = c.heroi.y - 44 * hop;
      hr = 5 * Math.sin(2 * Math.PI * jogo.tEstado / 1000);
      teiaModo = 'pendurada'; teiaOp = 0.5;
    }

    def(el.heroi, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${hr.toFixed(2)})`);

    if (teiaModo === 'pendurada') {
      const len = Math.max(1, hy + 80);
      def(el.linha, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(-90) scale(${len.toFixed(2)} 1)`);
      def(el.linha, 'opacity', teiaOp);
    } else if (teiaModo === 'alvo') {
      const dx = jogo.alvoCentro.x - hx, dy = jogo.alvoCentro.y - hy;
      const len = Math.max(0.01, Math.hypot(dx, dy) * teiaFrac);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      def(el.linha, 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${ang.toFixed(2)}) scale(${len.toFixed(2)} 1)`);
      def(el.linha, 'opacity', teiaOp);
    } else {
      def(el.linha, 'opacity', 0);
    }

    if (alvoPos) {
      def(el.alvo, 'transform', `translate(${alvoPos.x.toFixed(2)} ${alvoPos.y.toFixed(2)}) rotate(${alvoPos.rot.toFixed(2)}) scale(${alvoPos.esc.toFixed(3)})`);
      def(el.alvo, 'opacity', alvoPos.op.toFixed(3));
    } else {
      def(el.alvo, 'opacity', 0);
    }

    const podeCorda = c.cordaAlvo && alvoPos && (e === S.ESPERANDO || e === S.TEIA || e === S.BALANCO);
    if (podeCorda) {
      const p = pontoLocal(c.cordaAlvo.x, c.cordaAlvo.y, alvoPos.x, alvoPos.y, alvoPos.rot);
      const dx = p.x - c.ancorAlvo.x, dy = p.y - c.ancorAlvo.y;
      const len = Math.max(0.01, Math.hypot(dx, dy));
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      def(el.corda, 'transform', `translate(${c.ancorAlvo.x} ${c.ancorAlvo.y}) rotate(${ang.toFixed(2)}) scale(${len.toFixed(2)} 1)`);
      def(el.corda, 'opacity', (0.7 * alvoPos.op).toFixed(3));
    } else {
      def(el.corda, 'opacity', 0);
    }

    if (jogo.flashEm >= 0) {
      const p = clamp01((jogo.t - jogo.flashEm) / jogo.flashDur);
      def(el.flash, 'opacity', (jogo.flashPico * Math.sin(Math.PI * p)).toFixed(3));
      if (p >= 1) jogo.flashEm = -1;
    } else {
      def(el.flash, 'opacity', 0);
    }

    if (jogo.mudoAvisoEm >= 0) {
      const p = clamp01((jogo.t - jogo.mudoAvisoEm) / 1000);
      const op = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
      def(el.mudoIcone, 'opacity', op.toFixed(3));
      if (p >= 1) jogo.mudoAvisoEm = -1;
    } else {
      def(el.mudoIcone, 'opacity', 0);
    }
    def(el.mudoRisco, 'opacity', jogo.mudo ? 1 : 0);
  }

  // ---------- entrada ----------
  function paraVirtual(ev) {
    const ctm = el.svg.getScreenCTM();
    if (!ctm) return null;
    const pt = el.svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(ctm.inverse());
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return null;
    return p;
  }
  function aoClicar(ev) {
    if (ev.button !== 0) return;
    if (jogo.estado !== S.ESPERANDO || !jogo.alvoAtivo) return;
    const p = paraVirtual(ev);
    if (!p) return;
    const a = posAlvo();
    const noCirculo = Math.hypot(p.x - a.x, p.y - a.y) <= RAIO;
    const noTerco = p.x >= TERCO.x1 && p.x <= TERCO.x2 && p.y >= TERCO.y1 && p.y <= TERCO.y2;
    if (!noCirculo && !noTerco) return;
    iniciarTeia();
  }

  // ---------- attract mode + teclas do adulto ----------
  function cancelarDemo() {
    if (!jogo.demo) return false;
    jogo.demo = false;
    if (jogo.estado !== S.ESPERANDO) {
      jogo.alvoAtivo = false;
      jogo.alvoCongelado = false;
      jogo.espera = 0;
      jogo.splatAtivo = false;
      jogo.faiscasAtivas = false;
      jogo.duende.ativo = false;
      entrar(S.ESPERANDO);
    }
    return true;
  }
  function aoEntrada() {
    jogo.ocioso = 0;
    cancelarDemo();
  }
  function alternarMudo() {
    jogo.mudo = !jogo.mudo;
    Som.definirMudo(jogo.mudo);
    jogo.mudoAvisoEm = jogo.t;
  }
  function alternarTela() {
    try {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      } else {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }
  function aoTeclar(ev) {
    jogo.ocioso = 0;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key;
    if (k === 'm' || k === 'M') { alternarMudo(); ev.preventDefault(); }
    else if (k === 'f' || k === 'F') { alternarTela(); ev.preventDefault(); }
  }

  document.addEventListener('pointerdown', Som.destravar, { capture: true, passive: true });
  document.addEventListener('pointerdown', aoEntrada, { capture: true, passive: true });
  el.svg.addEventListener('pointerdown', aoClicar);
  el.svg.addEventListener('contextmenu', ev => ev.preventDefault());
  document.addEventListener('keydown', aoTeclar);

  montarCenario(0);
  iniciarDuende();
  let anterior = performance.now();
  function quadro(agora) {
    const dt = Math.min(100, Math.max(0, agora - anterior));
    anterior = agora;
    passo(dt);
    requestAnimationFrame(quadro);
  }
  desenhar();
  requestAnimationFrame(quadro);
})();
</script>
</body>
