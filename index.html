<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9BD8F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parquinho — escolha um jogo</title>
<link rel="icon" href="data:,">
<style>
  /* ===========================================================================
     Parquinho — vitrine de jogos infantis.
     Princípios herdados do TEMA.md dos jogos:
       · imagem primeiro (a criança escolhe pela figura, não pela leitura);
       · arquivo único, offline, sem dependência, sem texto obrigatório;
       · alvo grande, zero fricção, zero beco sem saída.
     Para adicionar um jogo, edite o array JOGOS no fim do arquivo.
     =========================================================================== */

  :root {
    --tinta:        #241633;
    --tinta-fraca:  #5A4A70;
    --creme:        #FFF6E6;
    --papel:        #FFFDF7;
    --sol:          #FFE066;
    --laranja:      #F0873F;
    --vermelho:     #E23B4E;
    --turquesa:     #2FB3A8;
    --verde-1:      #A7DB84;
    --verde-2:      #7CC15B;
    --verde-3:      #58A044;
    --display: "Arial Black", "Segoe UI Black", "Segoe UI", system-ui, -apple-system, sans-serif;
    --texto:   "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--texto);
    color: var(--tinta);
    background: linear-gradient(180deg, #86CCEF 0%, #A7DDF3 34%, #CDECF6 58%, #E9F7DE 80%, #DCEFC6 100%);
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    text-rendering: optimizeLegibility;
  }

  /* ------------------------------- fundo ---------------------------------- */
  .fundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .sol {
    position: absolute; top: -90px; right: -70px;
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #FFF6CC 0%, #FFE28A 46%, rgba(255,214,120,0) 72%);
    animation: pulsar-sol 9s ease-in-out infinite;
  }
  @keyframes pulsar-sol { 50% { transform: scale(1.06); } }

  .nuvem {
    position: absolute;
    width: 132px; height: 46px;
    background: #fff;
    border-radius: 999px;
    opacity: .92;
    filter: drop-shadow(0 8px 0 rgba(120,180,210,.18));
    animation: passar linear infinite;
  }
  .nuvem::before, .nuvem::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .nuvem::before { width: 58px; height: 58px; left: 22px; top: -26px; }
  .nuvem::after  { width: 40px; height: 40px; left: 62px; top: -16px; }
  .n1 { top: 12%;  left: -160px; transform: scale(1);    animation-duration: 58s; animation-delay: -6s;  }
  .n2 { top: 26%;  left: -160px; transform: scale(.7);   animation-duration: 74s; animation-delay: -30s; opacity: .8; }
  .n3 { top: 6%;   left: -160px; transform: scale(1.25); animation-duration: 92s; animation-delay: -58s; opacity: .7; }
  @keyframes passar { from { translate: -10vw 0; } to { translate: 115vw 0; } }

  .colinas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40vh; min-height: 240px; }

  /* ------------------------------ conteúdo -------------------------------- */
  .wrap {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) clamp(18px, 4vw, 40px) clamp(90px, 16vh, 150px);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
  }

  .cabecalho { text-align: center; margin-bottom: clamp(22px, 5vw, 46px); }

  .logo {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-size: clamp(2.7rem, 10vw, 5.2rem);
    line-height: .96;
    color: var(--sol);
    transform: rotate(-2deg);
    --o: clamp(3px, .9vw, 6px);
    text-shadow:
      calc(-1 * var(--o)) 0 0 var(--tinta), var(--o) 0 0 var(--tinta),
      0 calc(-1 * var(--o)) 0 var(--tinta), 0 var(--o) 0 var(--tinta),
      calc(-1 * var(--o)) calc(-1 * var(--o)) 0 var(--tinta),
      var(--o) calc(-1 * var(--o)) 0 var(--tinta),
      calc(-1 * var(--o)) var(--o) 0 var(--tinta), var(--o) var(--o) 0 var(--tinta),
      0 9px 0 rgba(36,22,51,.35);
    animation: entra-logo .7s cubic-bezier(.2,.9,.25,1.4) both;
  }
  @keyframes entra-logo {
    0%   { opacity: 0; transform: rotate(-10deg) scale(.6); }
    60%  { opacity: 1; transform: rotate(3deg) scale(1.06); }
    100% { opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  .dica {
    margin: 14px 0 0;
    font-size: clamp(.95rem, 2.4vw, 1.15rem);
    font-weight: 700;
    color: var(--tinta-fraca);
    letter-spacing: .01em;
    animation: entra-fade .7s ease .25s both;
  }
  @keyframes entra-fade { from { opacity: 0; transform: translateY(8px); } }

  /* ------------------------------ prateleira ------------------------------ */
  .prateleira {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 300px));
    justify-content: center;
    gap: clamp(20px, 4vw, 40px);
    width: 100%;
  }

  .card {
    --cor: var(--laranja);
    position: relative;
    display: block;
    aspect-ratio: 3 / 4;
    border-radius: 30px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    background: #1b1420;
    border: 6px solid var(--creme);
    box-shadow: 0 14px 0 rgba(36,22,51,.16), 0 24px 40px rgba(36,22,51,.26);
    outline: none;
    transition: transform .28s cubic-bezier(.2,.9,.3,1.5), box-shadow .28s ease;
    animation: entra-card .6s cubic-bezier(.2,.9,.3,1.35) both;
    animation-delay: calc(var(--i, 0) * 110ms + 200ms);
  }
  @keyframes entra-card { from { opacity: 0; transform: translateY(28px) scale(.92); } }

  .card:hover  { transform: translateY(-10px) scale(1.035) rotate(-1.2deg); box-shadow: 0 22px 0 rgba(36,22,51,.16), 0 34px 52px rgba(36,22,51,.32); }
  .card:active { transform: translateY(-2px) scale(1.0) rotate(-.4deg); transition-duration: .08s; }
  .card:focus-visible { box-shadow: 0 0 0 6px var(--sol), 0 22px 0 rgba(36,22,51,.16), 0 34px 52px rgba(36,22,51,.32); }

  .card-cena { position: absolute; inset: 0; }
  .card-cena svg { display: block; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.3,1); }
  .card:hover .card-cena svg, .card:focus-visible .card-cena svg { transform: scale(1.06); }

  .card-cena::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(18,9,28,.82) 0%, rgba(18,9,28,.34) 26%, rgba(18,9,28,0) 52%);
  }

  .card-chip {
    position: absolute; top: 12px; left: 12px;
    font-family: var(--display);
    font-size: .74rem; letter-spacing: .05em; text-transform: uppercase;
    color: var(--tinta);
    background: rgba(255,246,230,.94);
    border: 2px solid rgba(36,22,51,.14);
    border-radius: 999px;
    padding: 5px 11px;
    box-shadow: 0 4px 0 rgba(36,22,51,.18);
  }

  .card-placa {
    position: absolute; left: 16px; right: 78px; bottom: 16px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .card-titulo {
    font-family: var(--display);
    font-size: clamp(1.02rem, 2.6vw, 1.22rem);
    line-height: 1.05;
    letter-spacing: .01em;
    color: #fff;
    text-shadow: 0 2px 3px rgba(0,0,0,.45);
  }
  .card-sub { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.82); }

  .card-play {
    position: absolute; right: 14px; bottom: 14px;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--cor);
    border: 4px solid var(--creme);
    display: grid; place-items: center;
    box-shadow: 0 6px 0 rgba(36,22,51,.3);
    animation: pulsa-play 2.6s ease-in-out infinite;
  }
  .card:hover .card-play, .card:focus-visible .card-play { animation: pula-play .8s ease-in-out infinite; }
  .card-play::before {
    content: ""; margin-left: 5px;
    width: 0; height: 0;
    border-left: 17px solid #fff;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.25));
  }
  @keyframes pulsa-play { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  @keyframes pula-play  { 0%,100% { transform: scale(1.05) translateY(0); } 50% { transform: scale(1.14) translateY(-4px); } }

  .rodape {
    position: relative; z-index: 1;
    margin-top: clamp(30px, 6vw, 54px);
    font-size: .84rem; font-weight: 700;
    color: var(--tinta-fraca);
    text-align: center;
    opacity: .85;
  }
  .rodape span { color: var(--tinta); }

  /* ------------------------------ animações da cena ----------------------- */
  .gato { animation: bob 2.9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }

  .confete-cena > g { animation: flutua 3.4s ease-in-out infinite; }
  .confete-cena > g:nth-child(2) { animation-delay: -1.1s; }
  .confete-cena > g:nth-child(3) { animation-delay: -2.2s; }
  @keyframes flutua { 0%,100% { transform: translateY(0); opacity: .95; } 50% { transform: translateY(-12px); opacity: .6; } }

  /* ------------------------------ movimento reduzido ---------------------- */
  @media (prefers-reduced-motion: reduce) {
    .sol, .nuvem, .logo, .dica, .card, .gato, .confete-cena > g, .card-play { animation: none !important; }
    .card:hover, .card:active { transform: none; }
    .card-cena svg { transition: none; }
  }
  .menos-movimento .sol,
  .menos-movimento .nuvem,
  .menos-movimento .logo,
  .menos-movimento .dica,
  .menos-movimento .card,
  .menos-movimento .gato,
  .menos-movimento .confete-cena > g,
  .menos-movimento .card-play { animation: none !important; }

  @media (max-width: 520px) {
    .card { border-width: 5px; border-radius: 26px; }
    .card-play { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

  <!-- fundo atmosférico (paisagem de parque, em CSS/SVG, sem imagem externa) -->
  <div class="fundo" aria-hidden="true">
    <div class="sol"></div>
    <div class="nuvem n1"></div>
    <div class="nuvem n2"></div>
    <div class="nuvem n3"></div>
    <svg class="colinas" viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#A7DB84" d="M0 180 Q 240 96 480 150 T 960 128 T 1440 168 L 1440 420 L 0 420 Z"/>
      <g fill="#7CC15B">
        <circle cx="196" cy="126" r="46"/><circle cx="238" cy="140" r="34"/><circle cx="158" cy="142" r="30"/>
        <rect x="192" y="150" width="10" height="46" rx="4"/>
        <circle cx="1188" cy="118" r="52"/><circle cx="1234" cy="134" r="38"/><circle cx="1146" cy="136" r="33"/>
        <rect x="1183" y="150" width="11" height="52" rx="4"/>
      </g>
      <path fill="#58A044" d="M0 254 Q 320 200 620 244 T 1180 232 T 1440 250 L 1440 420 L 0 420 Z"/>
    </svg>
  </div>

  <main class="wrap">
    <header class="cabecalho">
      <h1 class="logo">Parquinho</h1>
      <p class="dica">Clique na figura para jogar</p>
    </header>

    <section id="prateleira" class="prateleira" aria-label="Jogos disponíveis"></section>

    <footer class="rodape">Feito para o <span>Murilo</span> e o <span>Pedro</span> · mais jogos em breve</footer>
  </main>

  <!-- ------------------------------------------------------------------ -->
  <!-- Modelo de cartão. O <a> é o próprio botão: a criança clica na figura. -->
  <!-- ------------------------------------------------------------------ -->
  <template id="tpl-card">
    <a class="card">
      <span class="card-cena"></span>
      <span class="card-chip"></span>
      <span class="card-placa">
        <span class="card-titulo"></span>
        <span class="card-sub"></span>
      </span>
      <span class="card-play" aria-hidden="true"></span>
    </a>
  </template>

  <!-- =================================================================== -->
  <!-- ARTE — Teia do Murilo. Cena em miniatura (SVG inline, sem imagem).   -->
  <!-- =================================================================== -->
  <template id="arte-teia">
    <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="teia-ceu" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6B4E8F"/>
          <stop offset=".46" stop-color="#F08A5D"/>
          <stop offset="1" stop-color="#FFD08A"/>
        </linearGradient>
        <radialGradient id="teia-sol">
          <stop offset="0" stop-color="#FFF8DC"/>
          <stop offset=".6" stop-color="#FFE3A8"/>
          <stop offset="1" stop-color="#FFC97E"/>
        </radialGradient>
        <radialGradient id="teia-halo">
          <stop offset="0" stop-color="#FFD166" stop-opacity=".9"/>
          <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="300" height="400" fill="url(#teia-ceu)"/>
      <circle cx="238" cy="104" r="120" fill="url(#teia-halo)" opacity=".5"/>
      <circle cx="238" cy="104" r="64" fill="url(#teia-sol)"/>

      <g fill="#FFD9BC" opacity=".9">
        <path opacity=".34" d="M16 96 C32 82 58 80 74 88 C90 76 120 76 136 88 C154 82 176 88 182 98 C190 102 186 108 174 108 L28 108 C16 108 10 102 16 96 Z"/>
        <path opacity=".3"  d="M150 188 C162 178 182 176 194 182 C206 174 228 174 240 182 C254 178 270 182 274 190 C280 192 277 196 268 196 L160 196 C150 196 145 192 150 188 Z"/>
      </g>

      <path fill="#3B2347" opacity=".5" d="M0 400 L0 300 L40 300 L40 274 L78 274 L78 306 L118 306 L118 262 L158 262 L158 306 L206 306 L206 282 L246 282 L246 312 L300 312 L300 400 Z"/>
      <path fill="#2B1B3D" d="M0 400 L0 346 L54 346 L72 328 L228 328 L246 346 L300 346 L300 400 Z"/>

      <line x1="150" y1="86" x2="168" y2="-10" stroke="#F4EEE2" stroke-width="3.2" stroke-linecap="round"/>

      <!-- herói pendurado: pêndulo sutil em torno da mão (ponto da teia) -->
      <g transform="translate(150 86) scale(.74)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-3.5 0 0; 3.5 0 0; -3.5 0 0" dur="3.8s" repeatCount="indefinite"
            calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
          <path fill="none" stroke="#1B1420" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" d="M1 4 C7 18 13 34 17 52 M49 126 C55 142 57 156 56 168 M17 176 C13 194 10 208 8 218 M35 176 C39 194 42 208 43 218"/>
          <path fill="none" stroke="#31549F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M1 4 C7 18 13 34 17 52 M49 126 C55 142 57 156 56 168 M17 176 C13 194 10 208 8 218 M35 176 C39 194 42 208 43 218"/>
          <path fill="none" stroke="#1B1420" stroke-width="21" stroke-linecap="round" d="M7 216 L6 227 M44 216 L45 227"/>
          <path fill="none" stroke="#E23B4E" stroke-width="15" stroke-linecap="round" d="M7 216 L6 227 M44 216 L45 227"/>
          <path fill="#E23B4E" stroke="#1B1420" stroke-width="4" stroke-linejoin="round" d="M8 120 Q5 113 13 111 L40 111 Q48 113 45 121 L42 169 Q41 177 33 177 L18 177 Q11 177 10 169 Z"/>
          <path fill="none" stroke="#1B1420" stroke-width="1.5" opacity=".42" d="M13 124 Q26 118 40 124 M11 138 Q26 132 42 138 M10 152 Q26 146 43 152 M15 166 Q26 160 38 166 M26 114 L26 176 M19 116 L15 175 M33 116 L37 175"/>
          <path fill="none" stroke="#1B1420" stroke-width="2" stroke-linecap="round" d="M26 139 L26 150 M22 141 L16 137 M30 141 L36 137 M22 147 L16 151 M30 147 L36 151"/>
          <circle cx="25" cy="92" r="38" fill="#E23B4E" stroke="#1B1420" stroke-width="4"/>
          <path fill="none" stroke="#1B1420" stroke-width="1.8" opacity=".5" d="M25 55 L25 129 M-9 78 Q25 69 59 78 M-12 92 Q25 83 62 92 M-9 106 Q25 97 59 106 M6 62 Q25 70 44 62 M4 120 Q25 112 46 120"/>
          <ellipse cx="10" cy="88" rx="12" ry="16.5" transform="rotate(-16 10 88)" fill="#F8F5FF" stroke="#1B1420" stroke-width="2"/>
          <ellipse cx="40" cy="88" rx="12" ry="16.5" transform="rotate(16 40 88)" fill="#F8F5FF" stroke="#1B1420" stroke-width="2"/>
          <circle cx="57" cy="173" r="8.5" fill="#E23B4E" stroke="#1B1420" stroke-width="3"/>
          <circle cx="0" cy="0" r="8.5" fill="#E23B4E" stroke="#1B1420" stroke-width="3"/>
        </g>
      </g>

      <!-- gatinho resgatado, na beirada do telhado -->
      <g transform="translate(224 324) scale(.52)">
        <g class="gato">
          <circle cx="0" cy="-2" r="74" fill="url(#teia-halo)" opacity=".5"/>
          <path fill="#FFF2DD" stroke="#2A1A3A" stroke-width="3" stroke-linejoin="round" d="M-18 -34 L-13 -56 L2 -40 Z M18 -34 L13 -56 L-2 -40 Z"/>
          <path fill="#F3B7A3" d="M-14 -37 L-11 -49 L-2 -40 Z M14 -37 L11 -49 L2 -40 Z"/>
          <path fill="#FFF2DD" stroke="#2A1A3A" stroke-width="3" stroke-linejoin="round" d="M-23 14 Q-26 40 -14 44 L14 44 Q26 40 23 14 L19 -8 Q10 -18 0 -18 Q-10 -18 -19 -8 Z"/>
          <circle cx="0" cy="-22" r="23" fill="#FFF2DD" stroke="#2A1A3A" stroke-width="3"/>
          <path fill="none" stroke="#E8A87C" stroke-width="3" stroke-linecap="round" d="M-23 -30 L-16 -33 M-24 -22 L-17 -24 M23 -30 L16 -33 M24 -22 L17 -24"/>
          <path fill="none" stroke="#E8A87C" stroke-width="2.6" stroke-linecap="round" d="M-12 4 L-16 12 M-4 8 L-6 17 M12 4 L16 12 M4 8 L6 17"/>
          <ellipse cx="-8" cy="-26" rx="4.6" ry="6.2" fill="#2A1A3A"/>
          <ellipse cx="8" cy="-26" rx="4.6" ry="6.2" fill="#2A1A3A"/>
          <circle cx="-6.6" cy="-28" r="1.5" fill="#FFFDF7"/>
          <circle cx="9.4" cy="-28" r="1.5" fill="#FFFDF7"/>
          <path fill="#F3A0A0" d="M0 -15 L-3.5 -19 L3.5 -19 Z"/>
          <path fill="none" stroke="#2A1A3A" stroke-width="2" stroke-linecap="round" d="M0 -15 L0 -12 M0 -12 Q-4 -8 -7 -10 M0 -12 Q4 -8 7 -10"/>
          <path fill="none" stroke="#2A1A3A" stroke-width="1.6" stroke-linecap="round" opacity=".7" d="M-24 -18 L-38 -23 M-24 -13 L-38 -12 M24 -18 L38 -23 M24 -13 L38 -12"/>
          <path fill="none" stroke="#2A1A3A" stroke-width="8" stroke-linecap="round" d="M20 30 Q38 34 36 18 Q35 8 44 6"/>
          <path fill="none" stroke="#E8A87C" stroke-width="2.4" stroke-linecap="round" opacity=".8" d="M-12 44 Q-12 48 -8 48 M12 44 Q12 48 8 48"/>
        </g>
      </g>

      <!-- confete pairando -->
      <g class="confete-cena">
        <g transform="translate(52 150)"><rect width="7" height="11" rx="2" fill="#FFD166"/></g>
        <g transform="translate(92 118)"><rect width="7" height="11" rx="2" fill="#4ECDC4"/></g>
        <g transform="translate(258 220)"><rect width="7" height="11" rx="2" fill="#F26D5B"/></g>
      </g>
    </svg>
  </template>

  <script>
  'use strict';
  (() => {
    // ----------------------------------------------------------------------
    // Catálogo de jogos. Para publicar um jogo novo, adicione um item aqui e
    // crie um <template id="arte-..."> com a cena em SVG.
    // ----------------------------------------------------------------------
    const JOGOS = [
      {
        id: 'teia',
        titulo: 'Teia do Murilo',
        dono: 'Murilo',
        sub: 'teia, balanço e resgate',
        href: 'murilo/teia-do-murilo.html',
        arte: 'arte-teia',
        cor: 'var(--vermelho)',
      },
    ];

    const prateleira = document.getElementById('prateleira');
    const tplCard = document.getElementById('tpl-card');

    JOGOS.forEach((jogo, i) => {
      const frag = tplCard.content.cloneNode(true);
      const card = frag.querySelector('.card');
      card.href = jogo.href;
      card.style.setProperty('--i', i);
      if (jogo.cor) card.style.setProperty('--cor', jogo.cor);
      card.setAttribute('aria-label', `Abrir o jogo ${jogo.titulo}`);

      const cena = frag.querySelector('.card-cena');
      const arte = document.getElementById(jogo.arte);
      if (arte) cena.appendChild(arte.content.cloneNode(true));

      frag.querySelector('.card-chip').textContent = jogo.dono;
      frag.querySelector('.card-titulo').textContent = jogo.titulo;
      frag.querySelector('.card-sub').textContent = jogo.sub || '';

      prateleira.appendChild(frag);
    });

    // Respeita "reduzir movimento": desliga CSS e pausa as animações SMIL da cena.
    const semMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (semMovimento) {
      document.documentElement.classList.add('menos-movimento');
      for (const svg of document.querySelectorAll('.card-cena svg')) {
        try { svg.pauseAnimations(); } catch (e) {}
      }
    }
  })();
  </script>
</body>
</html>
