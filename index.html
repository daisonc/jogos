<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9BD8F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parquinho — escolha um jogo</title>
<link rel="icon" href="data:,">
<style>
  /* ===========================================================================
     Parquinho — vitrine de jogos infantis.
     Princípios herdados do TEMA.md dos jogos:
       · imagem primeiro (a criança escolhe pela figura, não pela leitura);
       · arquivo único, offline, sem dependência, sem texto obrigatório;
       · alvo grande, zero fricção, zero beco sem saída.
     Para adicionar um jogo, edite o array JOGOS no fim do arquivo.
     =========================================================================== */

  :root {
    --tinta:        #241633;
    --tinta-fraca:  #5A4A70;
    --creme:        #FFF6E6;
    --papel:        #FFFDF7;
    --sol:          #FFE066;
    --laranja:      #F0873F;
    --vermelho:     #E23B4E;
    --turquesa:     #2FB3A8;
    --verde-1:      #A7DB84;
    --verde-2:      #7CC15B;
    --verde-3:      #58A044;
    --display: "Arial Black", "Segoe UI Black", "Segoe UI", system-ui, -apple-system, sans-serif;
    --texto:   "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--texto);
    color: var(--tinta);
    background: linear-gradient(180deg, #86CCEF 0%, #A7DDF3 34%, #CDECF6 58%, #E9F7DE 80%, #DCEFC6 100%);
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    text-rendering: optimizeLegibility;
  }

  /* ------------------------------- fundo ---------------------------------- */
  .fundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .sol {
    position: absolute; top: -90px; right: -70px;
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #FFF6CC 0%, #FFE28A 46%, rgba(255,214,120,0) 72%);
    animation: pulsar-sol 9s ease-in-out infinite;
  }
  @keyframes pulsar-sol { 50% { transform: scale(1.06); } }

  .nuvem {
    position: absolute;
    width: 132px; height: 46px;
    background: #fff;
    border-radius: 999px;
    opacity: .92;
    filter: drop-shadow(0 8px 0 rgba(120,180,210,.18));
    animation: passar linear infinite;
  }
  .nuvem::before, .nuvem::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .nuvem::before { width: 58px; height: 58px; left: 22px; top: -26px; }
  .nuvem::after  { width: 40px; height: 40px; left: 62px; top: -16px; }
  .n1 { top: 12%;  left: -160px; transform: scale(1);    animation-duration: 58s; animation-delay: -6s;  }
  .n2 { top: 26%;  left: -160px; transform: scale(.7);   animation-duration: 74s; animation-delay: -30s; opacity: .8; }
  .n3 { top: 6%;   left: -160px; transform: scale(1.25); animation-duration: 92s; animation-delay: -58s; opacity: .7; }
  @keyframes passar { from { translate: -10vw 0; } to { translate: 115vw 0; } }

  .colinas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40vh; min-height: 240px; }

  /* ------------------------------ conteúdo -------------------------------- */
  .wrap {
    position: relative; z-index: 1;
    max-width: 1180px; margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) clamp(18px, 4vw, 40px) clamp(90px, 16vh, 150px);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
  }

  .cabecalho { text-align: center; margin-bottom: clamp(22px, 5vw, 46px); }

  .logo {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-size: clamp(2.7rem, 10vw, 5.2rem);
    line-height: .96;
    color: var(--sol);
    transform: rotate(-2deg);
    --o: clamp(3px, .9vw, 6px);
    text-shadow:
      calc(-1 * var(--o)) 0 0 var(--tinta), var(--o) 0 0 var(--tinta),
      0 calc(-1 * var(--o)) 0 var(--tinta), 0 var(--o) 0 var(--tinta),
      calc(-1 * var(--o)) calc(-1 * var(--o)) 0 var(--tinta),
      var(--o) calc(-1 * var(--o)) 0 var(--tinta),
      calc(-1 * var(--o)) var(--o) 0 var(--tinta), var(--o) var(--o) 0 var(--tinta),
      0 9px 0 rgba(36,22,51,.35);
    animation: entra-logo .7s cubic-bezier(.2,.9,.25,1.4) both;
  }
  @keyframes entra-logo {
    0%   { opacity: 0; transform: rotate(-10deg) scale(.6); }
    60%  { opacity: 1; transform: rotate(3deg) scale(1.06); }
    100% { opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  .dica {
    margin: 14px 0 0;
    font-size: clamp(.95rem, 2.4vw, 1.15rem);
    font-weight: 700;
    color: var(--tinta-fraca);
    letter-spacing: .01em;
    animation: entra-fade .7s ease .25s both;
  }
  @keyframes entra-fade { from { opacity: 0; transform: translateY(8px); } }

  /* ------------------------------ prateleira ------------------------------ */
  .prateleira {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 250px));
    justify-content: center;
    gap: clamp(16px, 2.4vw, 28px);
    width: 100%;
  }

  .card {
    --cor: var(--laranja);
    position: relative;
    display: block;
    aspect-ratio: 3 / 4;
    border-radius: 30px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    background: #1b1420;
    border: 6px solid var(--creme);
    box-shadow: 0 14px 0 rgba(36,22,51,.16), 0 24px 40px rgba(36,22,51,.26);
    outline: none;
    transition: transform .28s cubic-bezier(.2,.9,.3,1.5), box-shadow .28s ease;
    animation: entra-card .6s cubic-bezier(.2,.9,.3,1.35) both;
    animation-delay: calc(var(--i, 0) * 110ms + 200ms);
  }
  @keyframes entra-card { from { opacity: 0; transform: translateY(28px) scale(.92); } }

  .card:hover  { transform: translateY(-10px) scale(1.035) rotate(-1.2deg); box-shadow: 0 22px 0 rgba(36,22,51,.16), 0 34px 52px rgba(36,22,51,.32); }
  .card:active { transform: translateY(-2px) scale(1.0) rotate(-.4deg); transition-duration: .08s; }
  .card:focus-visible { box-shadow: 0 0 0 6px var(--sol), 0 22px 0 rgba(36,22,51,.16), 0 34px 52px rgba(36,22,51,.32); }

  .card-cena { position: absolute; inset: 0; }
  .card-cena svg { display: block; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.3,1); }
  .card:hover .card-cena svg, .card:focus-visible .card-cena svg { transform: scale(1.06); }

  .card-cena::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(18,9,28,.82) 0%, rgba(18,9,28,.34) 26%, rgba(18,9,28,0) 52%);
  }

  .card-chip {
    position: absolute; top: 12px; left: 12px;
    font-family: var(--display);
    font-size: .74rem; letter-spacing: .05em; text-transform: uppercase;
    color: var(--tinta);
    background: rgba(255,246,230,.94);
    border: 2px solid rgba(36,22,51,.14);
    border-radius: 999px;
    padding: 5px 11px;
    box-shadow: 0 4px 0 rgba(36,22,51,.18);
  }

  .card-placa {
    position: absolute; left: 16px; right: 78px; bottom: 16px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .card-titulo {
    font-family: var(--display);
    font-size: clamp(1.02rem, 2.6vw, 1.22rem);
    line-height: 1.05;
    letter-spacing: .01em;
    color: #fff;
    text-shadow: 0 2px 3px rgba(0,0,0,.45);
  }
  .card-sub { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.82); }

  .card-play {
    position: absolute; right: 14px; bottom: 14px;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--cor);
    border: 4px solid var(--creme);
    display: grid; place-items: center;
    box-shadow: 0 6px 0 rgba(36,22,51,.3);
    animation: pulsa-play 2.6s ease-in-out infinite;
  }
  .card:hover .card-play, .card:focus-visible .card-play { animation: pula-play .8s ease-in-out infinite; }
  .card-play::before {
    content: ""; margin-left: 5px;
    width: 0; height: 0;
    border-left: 17px solid #fff;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.25));
  }
  @keyframes pulsa-play { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  @keyframes pula-play  { 0%,100% { transform: scale(1.05) translateY(0); } 50% { transform: scale(1.14) translateY(-4px); } }

  /* -------- seleção: o cartão "abre" e só então navega (ver ATRASO_SELECAO) ------ */
  .prateleira.selecionando .card:not(.selecionado) {
    opacity: .26; filter: saturate(.5) blur(1px); transform: scale(.95);
    transition: opacity .32s ease, transform .32s ease, filter .32s ease;
  }
  .card.selecionado {
    animation: none;
    transform: scale(1.09) rotate(0deg);
    box-shadow: 0 0 0 9px var(--sol), 0 30px 60px rgba(36,22,51,.42);
    z-index: 3;
  }
  .card.selecionado .card-cena svg { transform: scale(1.2); transition: transform .5s cubic-bezier(.25,.8,.25,1); }
  .card.selecionado .card-play { animation: estoura .5s ease-out both; }
  .card.selecionado::before {
    content: ""; position: absolute; inset: 0; z-index: 4; border-radius: inherit;
    background: radial-gradient(circle at 72% 78%, rgba(255,244,190,.95), rgba(255,244,190,0) 62%);
    animation: clarao .5s ease-out both;
  }
  @keyframes estoura { 0% { transform: scale(1); } 45% { transform: scale(1.4); } 100% { transform: scale(1.12); } }
  @keyframes clarao  { 0% { opacity: 0; } 26% { opacity: .95; } 100% { opacity: 0; } }

  .rodape {
    position: relative; z-index: 1;
    margin-top: clamp(30px, 6vw, 54px);
    font-size: .84rem; font-weight: 700;
    color: var(--tinta-fraca);
    text-align: center;
    opacity: .85;
  }
  .rodape span { color: var(--tinta); }

  /* ------------------------------ animações da cena ----------------------- */
  .gato { animation: bob 2.9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }

  .confete-cena > g { animation: flutua 3.4s ease-in-out infinite; }
  .confete-cena > g:nth-child(2) { animation-delay: -1.1s; }
  .confete-cena > g:nth-child(3) { animation-delay: -2.2s; }
  @keyframes flutua { 0%,100% { transform: translateY(0); opacity: .95; } 50% { transform: translateY(-12px); opacity: .6; } }

  /* ------------------------------ movimento reduzido ---------------------- */
  @media (prefers-reduced-motion: reduce) {
    .sol, .nuvem, .logo, .dica, .card, .gato, .confete-cena > g, .card-play { animation: none !important; }
    .card.selecionado .card-play, .card.selecionado::before { animation: none !important; }
    .card:hover, .card:active { transform: none; }
    .card-cena svg { transition: none; }
  }
  .menos-movimento .sol,
  .menos-movimento .nuvem,
  .menos-movimento .logo,
  .menos-movimento .dica,
  .menos-movimento .card,
  .menos-movimento .gato,
  .menos-movimento .confete-cena > g,
  .menos-movimento .card-play { animation: none !important; }
  .menos-movimento .card.selecionado .card-play,
  .menos-movimento .card.selecionado::before { animation: none !important; }

  @media (max-width: 520px) {
    .card { border-width: 5px; border-radius: 26px; }
    .card-play { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

  <!-- fundo atmosférico (paisagem de parque, em CSS/SVG, sem imagem externa) -->
  <div class="fundo" aria-hidden="true">
    <div class="sol"></div>
    <div class="nuvem n1"></div>
    <div class="nuvem n2"></div>
    <div class="nuvem n3"></div>
    <svg class="colinas" viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#A7DB84" d="M0 180 Q 240 96 480 150 T 960 128 T 1440 168 L 1440 420 L 0 420 Z"/>
      <g fill="#7CC15B">
        <circle cx="196" cy="126" r="46"/><circle cx="238" cy="140" r="34"/><circle cx="158" cy="142" r="30"/>
        <rect x="192" y="150" width="10" height="46" rx="4"/>
        <circle cx="1188" cy="118" r="52"/><circle cx="1234" cy="134" r="38"/><circle cx="1146" cy="136" r="33"/>
        <rect x="1183" y="150" width="11" height="52" rx="4"/>
      </g>
      <path fill="#58A044" d="M0 254 Q 320 200 620 244 T 1180 232 T 1440 250 L 1440 420 L 0 420 Z"/>
    </svg>
  </div>

  <main class="wrap">
    <header class="cabecalho">
      <h1 class="logo">Parquinho</h1>
      <p class="dica">Clique na figura para jogar</p>
    </header>

    <section id="prateleira" class="prateleira" aria-label="Jogos disponíveis"></section>

    <footer class="rodape">Feito para o <span>Murilo</span> e o <span>Pedro</span> · mais jogos em breve</footer>
  </main>

  <!-- ------------------------------------------------------------------ -->
  <!-- Modelo de cartão. O <a> é o próprio botão: a criança clica na figura. -->
  <!-- ------------------------------------------------------------------ -->
  <template id="tpl-card">
    <a class="card">
      <span class="card-cena"></span>
      <span class="card-chip"></span>
      <span class="card-placa">
        <span class="card-titulo"></span>
        <span class="card-sub"></span>
      </span>
      <span class="card-play" aria-hidden="true"></span>
    </a>
  </template>

  <!-- =================================================================== -->
  <!-- ARTE — Veloz do Murilo. Cena em miniatura (SVG inline, sem imagem).  -->
  <!-- =================================================================== -->
  <template id="arte-veloz">
    <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="veloz-ceu" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#87CEEB"/>
          <stop offset="1" stop-color="#C9E9F6"/>
        </linearGradient>
        <radialGradient id="veloz-sol">
          <stop offset="0" stop-color="#FFF8DC"/>
          <stop offset=".6" stop-color="#FFE3A8"/>

      <rect width="300" height="400" fill="url(#veloz-ceu)"/>

      <path fill="#58A044" d="M0 330 Q100 310 200 330 Q260 342 300 328 L300 400 L0 400 Z"/>
      <path fill="none" stroke="#7FC4FF" stroke-width="4" stroke-linecap="round" d="M20 180 L90 180 M40 210 L120 210 M30 240 L100 240" opacity=".7"/>
      <!-- Sonic correndo -->
      <g transform="translate(170 240) scale(1.2) rotate(8)">
        <path fill="none" stroke="#1A4A9E" stroke-width="10" stroke-linecap="round" d="M-8 22 L-12 54 M8 22 L12 54"/>
        <path fill="none" stroke="#2E6BD6" stroke-width="7" stroke-linecap="round" d="M-8 22 L-12 54 M8 22 L12 54"/>
        <path fill="none" stroke="#8B1E2D" stroke-width="12" stroke-linecap="round" d="M-14 58 L-16 66 M14 58 L16 66"/>

        <path fill="#F5D7A3" d="M-10 4 Q0 10 10 4 L8 24 Q0 28 -8 24 Z"/>

        <circle cx="18" cy="-40" r="2.4" fill="#1B1420"/>
      </g>
    </svg>
  </template>

  <!-- =================================================================== -->
  <!-- ARTE — Raio do Murilo. Cena em miniatura (SVG inline, sem imagem).   -->
  <!-- =================================================================== -->
  <template id="arte-raio">
    <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="raio-ceu" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4FA9DE"/>
          <stop offset=".62" stop-color="#9FD6F0"/>
          <stop offset="1" stop-color="#E4F5FB"/>
        </linearGradient>
        <radialGradient id="raio-sol">
          <stop offset="0" stop-color="#FFF8DC"/>
          <stop offset=".6" stop-color="#FFE3A8"/>
          <stop offset="1" stop-color="#FFC97E"/>
        </radialGradient>
        <radialGradient id="raio-halo">
          <stop offset="0" stop-color="#FFF3B0" stop-opacity=".95"/>
          <stop offset=".5" stop-color="#FFE066" stop-opacity=".4"/>
          <stop offset="1" stop-color="#FFE066" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="300" height="400" fill="url(#raio-ceu)"/>
      <circle cx="252" cy="70" r="34" fill="url(#raio-sol)"/>

      <!-- torres ao fundo -->

        <ellipse cx="58" cy="330" rx="34" ry="17"/>
        <ellipse cx="86" cy="322" rx="26" ry="14"/>
        <ellipse cx="230" cy="352" rx="38" ry="18"/>
      </g>

      <!-- brinquedo (bola colorida) com halo -->

      <g transform="translate(240 132) scale(.40)">
        <circle r="40" fill="#F8F1E3" stroke="#2A1A3A" stroke-width="5"/>

        <path fill="#3FB8AF" d="M0 0 L-34.64 20 A40 40 0 0 1 0 -40 Z"/>
      </g>

      <!-- raio duplo: dois feixes que se abrem e convergem na bola -->
      <path fill="none" stroke="#FF9AA4" stroke-width="9" stroke-linecap="round" opacity=".5" d="M90 156 Q165 118 240 132"/>
      <path fill="none" stroke="#FF9AA4" stroke-width="9" stroke-linecap="round" opacity=".5" d="M110 156 Q172 138 240 132"/>
      <path fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" d="M90 156 Q165 118 240 132"/>
      <path fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" d="M110 156 Q172 138 240 132"/>
      <circle cx="240" cy="132" r="9" fill="#FF2A3C" opacity=".5"/>
      <circle cx="240" cy="132" r="4" fill="#FFF3C4"/>

      <!-- Super Homem voando, caixa no braço esquerdo -->
      <g transform="translate(100 238) scale(.86) rotate(-5)">
        <path fill="#E23B4E" stroke="#8B1E2D" stroke-width="5" stroke-linejoin="round"
              d="M-24 -66 C-72 -74 -116 -34 -122 18 C-108 10 -96 24 -82 18 C-70 40 -54 30 -42 40 L-24 4 Z"/>
        <path fill="#B72236" opacity=".6" d="M-46 -46 C-84 -44 -106 -12 -108 20 C-96 8 -80 26 -62 18 Z"/>

        <path fill="none" stroke="#1A4A9E" stroke-width="24" stroke-linecap="round" d="M-16 6 L-34 50"/>
        <path fill="none" stroke="#2E6BD6" stroke-width="16" stroke-linecap="round" d="M-16 6 L-34 50"/>
        <path fill="none" stroke="#1A4A9E" stroke-width="24" stroke-linecap="round" d="M16 6 L34 46"/>
        <path fill="none" stroke="#2E6BD6" stroke-width="16" stroke-linecap="round" d="M16 6 L34 46"/>

        <path fill="#2E6BD6" stroke="#1A4A9E" stroke-width="5" stroke-linejoin="round"
              d="M-34 -66 Q0 -80 34 -66 L28 6 Q0 18 -28 6 Z"/>
        <path fill="#F2C14E" stroke="#B8860B" stroke-width="3" d="M-28 -2 L28 -2 L27 10 L-27 10 Z"/>
        <path fill="#E23B4E" stroke="#8B1E2D" stroke-width="3" d="M-27 8 L27 8 L22 24 Q0 30 -22 24 Z"/>
        <path fill="#FFE066" stroke="#E23B4E" stroke-width="4" stroke-linejoin="round" d="M0 -56 L26 -26 L0 4 L-26 -26 Z"/>
        <path fill="#E23B4E" d="M0 -45 L15 -26 L0 -7 L-15 -26 Z"/>

        <path fill="none" stroke="#1A4A9E" stroke-width="22" stroke-linecap="round" d="M30 -56 Q56 -58 72 -38"/>

  <script>
  'use strict';
  (() => {
    // ----------------------------------------------------------------------
    // Catálogo de jogos. Para publicar um jogo novo, adicione um item aqui e
    // crie um <template id="arte-..."> com a cena em SVG.
    // ----------------------------------------------------------------------
    const JOGOS = [
      {
        id: 'teia',
        titulo: 'Teia do Murilo',
        dono: 'Murilo',
        sub: 'teia, balanço e resgate',
        href: 'murilo/teia-do-murilo.html',
        arte: 'arte-teia',
        cor: 'var(--vermelho)',
      },
      {
        id: 'forca',
        titulo: 'Força do Murilo',
        dono: 'Murilo',
        sub: 'salto, rompimento e amigo preso',
        href: 'murilo/hulk/forca-do-murilo.html',
        arte: 'arte-forca',
        cor: 'var(--verde-3)',
      },
      {
        id: 'veloz',
        titulo: 'Veloz do Murilo',
        dono: 'Murilo',
        sub: 'disparo, borrão e amigo preso',
        href: 'murilo/sonic/veloz-do-murilo.html',
        arte: 'arte-veloz',
        cor: '#2E6BD6',
      },
      {
        id: 'raio',
        titulo: 'Raio do Murilo',
        dono: 'Murilo',
        sub: 'voo, raio dos olhos e caixa',
        href: 'murilo/super/raio-do-murilo.html',
        arte: 'arte-raio',
        cor: '#E23B4E',
      },
    ];

    const prateleira = document.getElementById('prateleira');
    const tplCard = document.getElementById('tpl-card');
    const semMovimento = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    // Tempo entre o clique e a navegação: dá para ver o cartão "abrir" antes de entrar.
    const ATRASO_SELECAO = semMovimento ? 180 : 450;
    let navegando = false;

    JOGOS.forEach((jogo, i) => {
      const frag = tplCard.content.cloneNode(true);
      const card = frag.querySelector('.card');
      card.href = jogo.href;
      card.style.setProperty('--i', i);
      if (jogo.cor) card.style.setProperty('--cor', jogo.cor);
      card.setAttribute('aria-label', `Abrir o jogo ${jogo.titulo}`);

      const cena = frag.querySelector('.card-cena');
      const arte = document.getElementById(jogo.arte);
      if (arte) cena.appendChild(arte.content.cloneNode(true));

      frag.querySelector('.card-chip').textContent = jogo.dono;
      frag.querySelector('.card-titulo').textContent = jogo.titulo;
      frag.querySelector('.card-sub').textContent = jogo.sub || '';

      // Ao escolher: marca o cartão, toca o efeito de "abertura" e só depois navega.
      card.addEventListener('click', (ev) => {
        if (navegando) return;
        // deixa o navegador fazer o que o usuário pediu (nova aba/guia, botão do meio…)
        if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        ev.preventDefault();
        navegando = true;
        prateleira.classList.add('selecionando');
        card.classList.add('selecionado');
        window.setTimeout(() => { window.location.assign(jogo.href); }, ATRASO_SELECAO);
      });

      prateleira.appendChild(frag);
    });

    // Respeita "reduzir movimento": desliga CSS e pausa as animações SMIL da cena.
    if (semMovimento) {
      document.documentElement.classList.add('menos-movimento');
      for (const svg of document.querySelectorAll('.card-cena svg')) {
        try { svg.pauseAnimations(); } catch (e) {}
      }
    }
  })();
  </script>
